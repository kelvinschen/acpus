name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.18.0
          - 24.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:clean
      - run: pnpm typecheck
      - name: Check minimum-Node toolchain compatibility
        if: matrix.node-version == '22.18.0'
        run: pnpm check toolchain
      - name: Check repository policy
        if: matrix.node-version == '24.x'
        run: pnpm check
      - run: pnpm test
      - run: pnpm test:dist
      - run: git diff --check
      - run: git diff --exit-code -- packages/web/src/server/static-viz-assets.generated.ts
