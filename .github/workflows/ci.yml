name: CI

on:
  pull_request:
  push:
    branches:
      - next/acpus_ts_workflow
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 24.15.0
          - 24.x
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.7.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:clean
      - run: pnpm typecheck
      - run: pnpm check:build-toolchain
      - run: pnpm check:dead-code
      - run: pnpm check:dependencies
      - run: pnpm check:dependencies:strict
      - run: pnpm check:docs
      - run: pnpm check:security
      - run: pnpm test
      - run: pnpm test:dist
      - run: git diff --check
      - run: git diff --exit-code -- packages/web/src/server/static-viz-assets.generated.ts
