name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.7.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:clean
      - run: pnpm typecheck
      - run: pnpm check:dead-code
      - run: pnpm check:dependencies
      - run: pnpm check:dependencies:strict
      - run: pnpm test
      - run: pnpm test:dist
      - run: git diff --exit-code -- packages/web/src/server/static-viz-assets.generated.ts
