name: Release packages
run-name: Release packages from ${{ github.sha }}

on:
  push:
    branches:
      - main
    paths:
      - .changeset/**
      - packages/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify main commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Verify stable release mode
        run: test ! -f .changeset/pre.json

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.7.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:clean
      - run: pnpm typecheck
      - run: pnpm check:build-toolchain
      - run: pnpm check:dead-code
      - run: pnpm check:dependencies
      - run: pnpm check:dependencies:strict
      - run: pnpm check:docs
      - run: pnpm check:security
      - run: pnpm test
      - run: pnpm test:dist
      - run: git diff --check
      - run: git diff --exit-code -- packages/web/src/server/static-viz-assets.generated.ts

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Reverify main commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.7.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:clean
      - run: pnpm check:security
      - run: pnpm test:dist

      - name: Create version PR or publish stable packages
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm ci:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
