name: Publish alpha to npm

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-alpha
  cancel-in-progress: false

jobs:
  publish-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Require alpha prerelease mode
        run: |
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const state = JSON.parse(await readFile(".changeset/pre.json", "utf8"));
            if (state.mode !== "pre" || state.tag !== "alpha") process.exit(1);
          '

      - name: Prepare Changesets base branch
        run: |
          git fetch origin main:refs/remotes/origin/main
          git branch --force main refs/remotes/origin/main

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 9.7.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Show Changesets status
        run: |
          pnpm changeset status --verbose || {
            echo "::notice::Changesets status can fail after alpha version packages have already been committed; continuing because version and publish steps are authoritative."
          }

      - run: pnpm build

      - run: pnpm typecheck

      - run: pnpm check:build-toolchain

      - run: pnpm check:dead-code

      - run: pnpm check:dependencies

      - run: pnpm check:dependencies:strict

      - run: pnpm check:docs

      - run: pnpm check:security

      - run: pnpm test

      - name: Version alpha packages
        run: pnpm version-packages

      - name: Commit versioned alpha packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: version alpha packages" || echo "No version changes to commit"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Build publish artifacts
        run: pnpm build:clean

      - name: Verify publish artifacts
        run: pnpm test:dist

      - name: Publish alpha packages
        run: pnpm ci:publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
