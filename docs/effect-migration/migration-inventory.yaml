  - path: packages/agent-executor/src/turn-reducer.ts
    work_packages: []
    class: pure-domain
    target: [remain-pure]
    notes: do-not-effectify

repository_wide_census_queries:
  - neverthrow
  - ResultAsync
  - new Promise
  - new AbortController
  - setTimeout
  - setInterval
  - Promise.all
  - Promise.race
  - Promise.allSettled
  - closePromise
  - AggregateError
  - child_process

maintenance_rule: >-
  An execution agent must search its owned scope again before editing. If the
  census is stale, update this inventory or report the delta to the master;
  never silently design around stale planning data.
