# Master-maintained migration census. Verify entries against the current branch
# before issuing a work package. This is planning data, not a product contract.
baseline: feat/stable-acp-runtime-and-agent-orchestration
architecture:
  target: effect-v4
  durable_truth: acpus-events-store-projection-fencing

