    work_packages: [A03, D02, D03, D04]
    class: application-runtime
    legacy:
      - neverthrow-result
      - promise-executor
      - abort-controller-per-attempt
      - promise-settlement-registry
      - promise-race
      - set-timeout
      - set-interval-heartbeat
      - manual-cleanup-aggregation
    target:
      - effect-error-channel
      - scoped-attempt-fibers
      - interruption-adapter-at-executor-edge
      - effect-clock
      - structured-settlement
    durable_sensitive: true
    preserve:
      - SCH-001
      - SCH-002
      - SCH-003
      - SCH-004
      - SCH-005
      - STORE-001
      - STORE-002
    races: [RACE-001, RACE-002, RACE-003, RACE-004]

  - path: packages/runtime/src/scheduler/wakeup.ts
    work_packages: [D01]
    class: application-runtime
    legacy: [hand-rolled-deferred, versioned-promise-wakeup]
    target: [deferred-or-queue-with-version-semantics]
    durable_sensitive: false
    preserve: [LOCAL-001]
    races: [RACE-005]

  - path: packages/runtime/src/workspace-runtime.ts
