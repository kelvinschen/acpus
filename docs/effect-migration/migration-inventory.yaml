      - manual-resource-settlement
      - detached-close-on-authority-loss
    target:
      - effect-api
      - workspace-scope
      - scoped-heartbeat-and-tick-fibers
      - layer-composition-root
    durable_sensitive: true
    preserve: [AUTH-001, AUTH-002, LIFE-001, LIFE-002]
    races: [RACE-006, RACE-007]

  - path: packages/runtime/src/daemon/mutation-queue.ts
    work_packages: [D01]
