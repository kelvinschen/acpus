version: 1
name: example-topic-fanout-synthesis
description: Agent identifies topics, fanout reviews each, synthesis agent cross-validates findings.

input:
  subject: string
  output_root?: string = ".acpus/output/example-topic-fanout-synthesis"

agents:
  identifier:
    use: pi
  reviewer:
    use: pi
  synthesizer:
    use: pi

workflow:
  steps:
    - id: prepare
      run: program
      timeout: 30s
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          OUT="${{ input.output_root }}/${{ run_id }}"
          mkdir -p "$OUT"
          node -e '
          const out = process.argv[1];
          console.log(JSON.stringify({output_dir: out}));
          ' "$OUT"
      capture:
        from: stdout
        parse: json
      output:
        output_dir: string

    - id: identify
      run: agent
      use: identifier
      timeout: 10m
      prompt: |
        Identify the key topics worth investigating for the subject.
        Return each topic with a name and focus area.
        Subject:
        ${{ input.subject }}
      output:
        topics: [{ topic: string, focus: string }]

    - id: preflight
      parallel:
        - id: topic_count
          do:
            - id: count_topics
              run: program
              timeout: 30s
              cmd:
                - node
                - -e
                - |
                  const topics = JSON.parse(process.env.TOPICS);
                  console.log(JSON.stringify({count: topics.length}));
              env:
                TOPICS: ${{ json(steps.identify.output.topics) }}
              capture:
                from: stdout
                parse: json
              output:
                count: integer
        - id: critical_scan
          do:
            - id: scan_focus
              run: program
              timeout: 30s
              cmd:
                - node
                - -e
                - |
                  const topics = JSON.parse(process.env.TOPICS);
                  console.log(JSON.stringify({needs_deep_review: topics.some(t => /security|risk|critical/i.test(t.focus))}));
              env:
                TOPICS: ${{ json(steps.identify.output.topics) }}
              capture:
                from: stdout
                parse: json
              output:
                needs_deep_review: boolean
      join: all
      max_concurrency: 2

    - id: review_topics
      fanout:
        over: steps.identify.output.topics
        key: "${{ item_index }}-${{ item.topic }}"
        join: all
        do:
          - id: review
            run: agent
            use: reviewer
            timeout: 10m
            prompt: |
              Investigate this topic and write a report to:
              ${{ steps.prepare.output.output_dir }}/topic-${{ item_index }}.md
              Topic: ${{ item.topic }}
              Focus: ${{ item.focus }}
              Return the finding count and whether any are critical.
            output:
              report_path: string
              finding_count: integer
              has_critical: boolean

    - id: summarize_reviews
      run: program
      timeout: 30s
      cmd:
        - node
        - -e
        - |
          const reviews = JSON.parse(process.env.REVIEWS);
          console.log(JSON.stringify({
            review_count: reviews.length,
            total_findings: reviews.reduce((sum, r) => sum + r.finding_count, 0),
            has_critical: reviews.some(r => r.has_critical)
          }));
      env:
        REVIEWS: ${{ json(steps.review_topics.output) }}
      capture:
        from: stdout
        parse: json
      output:
        review_count: integer
        total_findings: integer
        has_critical: boolean

    - id: synthesize
      run: agent
      use: synthesizer
      timeout: 15m
      prompt: |
        Synthesize findings from ${{ steps.summarize_reviews.output.review_count }} topic reviews.
        Total findings reported: ${{ steps.summarize_reviews.output.total_findings }}
        Any critical findings: ${{ steps.summarize_reviews.output.has_critical }}
        Preflight counted ${{ steps.preflight.output.topic_count.count }} topics.
        Each review wrote its report to the output directory:
        ${{ steps.prepare.output.output_dir }}/
        Read every .md file in that directory and produce a cross-validated summary.
      output:
        report_path: string
        total_findings: integer
        overall_risk: string

outputs:
  topics_reviewed: ${{ steps.summarize_reviews.output.review_count }}
  first_review_path: ${{ steps.review_topics.output[0].report_path }}
  report_path: ${{ steps.synthesize.output.report_path }}
  total_findings: ${{ steps.synthesize.output.total_findings }}
  overall_risk: ${{ steps.synthesize.output.overall_risk }}
