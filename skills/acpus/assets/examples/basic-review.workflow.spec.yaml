version: 1
name: example-basic-review
description: Minimal review workflow with control output.

input:
  topic: string

agents:
  reviewer:
    use: codex

workflow:
  steps:
    - id: review
      run: agent
      use: reviewer
      prompt: |
        Review the topic and provide only the requested structured result.

        Topic:
        ${{ input.topic }}
      output:
        risk_count: integer
        ready: boolean

outputs:
  risk_count: ${{ steps.review.output.risk_count }}
  ready: ${{ steps.review.output.ready }}
