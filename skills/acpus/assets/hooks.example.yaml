# Acpus Hooks demo configuration.
#
# This file is intentionally named hooks.example.yaml, so Acpus will NOT load it
# automatically. The runtime only loads:
#
#   ~/.acpus/hooks.yaml
#   <workspace>/.acpus/hooks.yaml
#
# To try this demo, copy the parts you want into .acpus/hooks.yaml, then run a
# workflow that contains both Agent and Program nodes. Keep this file as a
# single-file reference: every handler below is inline and does not depend on
# any repository script.
#
# Handler protocol:
# - Acpus passes HookPayload JSON on stdin to every handler.
# - Injector handlers must write JSON to stdout.
# - Event handlers may write anything; stdout is ignored by Acpus.
# - Command strings run with shell semantics.
#
# Useful operational controls:
# - acpus hooks validate --project . --json
# - acpus hooks list --source
# - acpus workflows run <workflow.yaml> --skip-hooks

injectors:
  # beforeAgentExec runs before an Agent node is dispatched.
  #
  # It can return:
  #   {"prependPrompt":"..."}
  #
  # The returned text is prepended to the rendered agent prompt. Multiple
  # handlers are concatenated in order with newlines. The payload includes
  # agent/node identity, run metadata, and is_retry, but not prompt, because
  # this hook fires before the prompt is rendered.
  beforeAgentExec:
    - command: >-
        node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"{}");process.stdout.write(JSON.stringify({prependPrompt:`[Hook context]\nRun: ${p.run_id}\nWorkflow: ${p.workflow_name}\nNode: ${p.node_key}\nRetry: ${Boolean(p.is_retry)}\n`}));})'
      timeout: 5s
      # Injector failures default to fail. Use this for required context.
      on_failure: fail
      env:
        DEMO_INJECTOR: beforeAgentExec

    # Optional context source. If this command fails or returns invalid JSON,
    # Acpus logs a warning and continues because on_failure is skip.
    - command: >-
        node -e 'process.stdout.write(JSON.stringify({prependPrompt:"[Optional hook context] This line came from a skippable handler."}))'
      timeout: 2s
      on_failure: skip

  # beforeProgramExec runs before a Program node is dispatched.
  #
  # It can return:
  #   {"env":{"KEY":"VALUE"}}
  #
  # The env map is merged into the Program subprocess environment after normal
  # process env and step env. Later handlers override earlier keys.
  beforeProgramExec:
    - command: >-
        node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"{}");process.stdout.write(JSON.stringify({env:{ACPUS_HOOK_RUN_ID:p.run_id,ACPUS_HOOK_NODE_KEY:p.node_key,ACPUS_HOOK_WORKFLOW:p.workflow_name}}));})'
      timeout: 5s
      on_failure: fail

    # Demonstrates ordered env merging. This overrides one key from the prior
    # handler and adds a new one.
    - command: >-
        node -e 'process.stdout.write(JSON.stringify({env:{ACPUS_HOOK_WORKFLOW:"overridden-by-second-handler",ACPUS_HOOK_EXTRA:"available-to-program"}}))'
      timeout: 5s
      on_failure: fail

events:
  # beforeRun fires once at the first execution of a new Run. It does not fire
  # on retry or resume. Payload includes run input, run_attempt, and ir_digest.
  beforeRun:
    - command: >-
        node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"{}");console.error(`[hook:beforeRun] ${p.workflow_name} ${p.run_id} input=${JSON.stringify(p.input??{})}`);})'
      timeout: 30s
      # Event handlers are fire-and-forget by default. sync waits for this
      # handler before Acpus proceeds; useful for demos, tests, and important
      # notifications.
      sync: true

  # afterRun fires when a run reaches a terminal status. Payload includes
  # run_status, duration_ms, output, and error when present.
  afterRun:
    - command: >-
        node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"{}");console.error(`[hook:afterRun] status=${p.run_status} duration_ms=${p.duration_ms} output=${JSON.stringify(p.output??{})}`);})'
      timeout: 30s
      sync: true

  # onNodeStart fires when a node enters running. Node payloads include
  # node_key, node_id, node_kind, node_attempt, dynamic context fields when
  # applicable, and parent_node_* when the node is inside a real container.
  onNodeStart:
    - command: >-
        node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"{}");console.error(`[hook:onNodeStart] ${p.node_key} kind=${p.node_kind} attempt=${p.node_attempt}`);})'
      timeout: 30s

  # onNodeComplete fires when a node completes. For Agent nodes, payload may
  # include prompt, session_key, agent_model/type/policy, agent_response_text,
  # and agent_telemetry. For Program nodes, payload may include command, shell,
  # subprocess_env, exit_code, stdout, and stderr.
  onNodeComplete:
    - command: >-
        node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"{}");const agent=p.agent_telemetry?` agent_telemetry=${JSON.stringify(p.agent_telemetry)}`:"";const program=p.exit_code!==undefined?` exit_code=${p.exit_code}`:"";console.error(`[hook:onNodeComplete] ${p.node_key} output=${JSON.stringify(p.output??{})}${agent}${program}`);})'
      timeout: 30s
      sync: true

  # onNodeError fires when a node fails. It never changes the node/run outcome.
  # Payload includes error and failure_kind when known, including hook_failure
  # for injector-caused failures.
  onNodeError:
    - command: >-
        node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"{}");console.error(`[hook:onNodeError] ${p.node_key} failure_kind=${p.failure_kind??"unknown"} error=${p.error??""}`);})'
      timeout: 30s
      sync: true

  # onNodePaused fires when a node is paused by operator control. Long-running
  # Agent nodes may include partial prompt/telemetry/artifact-related fields.
  onNodePaused:
    - command: >-
        node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"{}");console.error(`[hook:onNodePaused] ${p.node_key} state=${p.to_state??p.node_kind}`);})'
      timeout: 30s

  # onNodeCancelled fires when a node is cancelled by operator control.
  onNodeCancelled:
    - command: >-
        node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"{}");console.error(`[hook:onNodeCancelled] ${p.node_key} state=${p.to_state??p.node_kind}`);})'
      timeout: 30s

  # onStateChange fires only for real state transitions, never for telemetry-only
  # writes. Payload includes from_state and to_state. Signal nodes additionally
  # emit running -> awaiting and awaiting -> completed transitions.
  onStateChange:
    - command: >-
        node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const p=JSON.parse(s||"{}");console.error(`[hook:onStateChange] ${p.node_key} ${p.from_state}->${p.to_state}`);})'
      timeout: 30s
      # Keep this async to demonstrate the default event behavior.
      sync: false
