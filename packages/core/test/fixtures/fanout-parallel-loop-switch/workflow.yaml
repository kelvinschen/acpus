version: 1
name: fanout-parallel-loop-switch
description: |
  Minimal compiler fixture: fanout(join:all) → parallel(agent, loop, switch).
  Covers two unique IR assertions not tested elsewhere:
    1. fanout.metadata.join propagation to compiled IR
    2. parallel node containing loop + switch composite children
input:
  lanes?:
    type: array
    default: ["alpha", "beta", "gamma"]
  max_rounds?: integer = 3
  route_mode?: string = "default"
agents:
  mock_agent: { type: command, use: "echo" }
workflow:
  steps:
    - id: fanout_parallel_loop_switch
      fanout:
        over: input.lanes
        key: "${{ item }}"
        max_concurrency: 1
        join: all
        do:
          - id: lane_parallel
            max_concurrency: 1
            parallel:
              - id: review_lane
                run: agent
                use: mock_agent
                prompt: "Review lane=${{ item_id }}"
                output:
                  branch: string
                  lane: string
                  ok: boolean
              - id: loop_lane
                loop:
                  until: loop.iter >= input.max_rounds
                  max_iterations: 3
                  do:
                    - id: loop_agent
                      run: agent
                      use: mock_agent
                      prompt: "Loop lane=${{ item_id }} round=${{ loop.iter }}"
                      output:
                        branch: string
                        round: integer
                        continue: boolean
              - id: switch_lane
                switch:
                  cases:
                    - when: item == "alpha"
                      do:
                        - id: switch_alpha_agent
                          run: agent
                          use: mock_agent
                          prompt: "Switch alpha"
                          output:
                            branch: string
                            lane: string
                            route: string
                    - when: input.route_mode == "default"
                      do:
                        - id: switch_default_agent
                          run: agent
                          use: mock_agent
                          prompt: "Switch default"
                          output:
                            branch: string
                            lane: string
                            route: string
                  default:
                    do:
                      - id: switch_fallback_agent
                        run: agent
                        use: mock_agent
                        prompt: "Switch fallback"
                        output:
                          branch: string
                          lane: string
                          route: string
outputs:
  lanes: "${{ steps.fanout_parallel_loop_switch }}"
