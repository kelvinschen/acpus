version: 1
name: composite-e2e
description: "Lightweight fixture for real-acpx E2E: fanout->loop only"
input:
  items?:
    type: array
    default: ["alpha", "beta"]
  max_rounds?: integer = 2
agents:
  mock:
    type: command
    use: "node ./packages/mock-agent/dist/index.js --script ./packages/core/test/fixtures/composite-e2e/mock.yaml"
    cwd: "."
workflow:
  steps:
    - id: composite
      fanout:
        over: input.items
        key: "${{ item }}"
        max_concurrency: 1
        do:
          - id: loop_body
            loop:
              until: loop.iter >= input.max_rounds
              do:
                - id: work
                  run: agent
                  use: mock
                  prompt: "step item=${{ item_id }} round=${{ loop.iter }}"
                  output:
                    item: string
                    round: integer
                    ok: boolean
