version: 1
name: all-primitives
input:
  files: array
agents:
  coder: { type: command, use: "echo", model: fixture }
workflow:
  steps:
    - id: discover
      run: program
      cmd: ["echo", "{\"files\":[{\"path\":\"a.ts\"}]}"]
      capture:
        from: stdout
        parse: json

    - id: review
      run: agent
      use: coder
      prompt: "Review ${{ steps.discover.output.files }}"
      output:
        issues:
          - description: string

    - id: branches
      parallel:
        - id: left
          do:
            - id: left_step
              run: program
              cmd: ["echo", "left"]
        - id: right
          do:
            - id: right_step
              run: program
              cmd: ["echo", "right"]

    - id: mapped
      fanout:
        over: steps.discover.output.files
        key: "${{ item.path }}"
        join: all
        do:
          - id: inspect_one
            run: agent
            use: coder
            prompt: "Inspect ${{ item.path }}"
            output:
              ok: boolean

    - id: require_mapped
      guard:
        when: len(steps.mapped.output) > 0
        then: continue
        else: fail
        message: "No files were mapped for inspection"

    - id: route
      switch:
        cases:
          - when: len(steps.mapped.output) > 0
            do:
              - id: route_yes
                run: program
                cmd: ["echo", "yes"]
        default:
          do:
            - id: route_no
              run: program
              cmd: ["echo", "no"]

    - id: fix_loop
      loop:
        until: loop.iter > 0 && coalesce(loop.last.ok, false)
        max_iterations: 2
        do:
          - id: fix_once
            run: agent
            use: coder
            prompt: "Fix round ${{ loop.iter }}"
            output:
              ok: boolean

    - id: human_gate
      run: signal
      prompt: "Approve?"
      output:
        approved: boolean
      timeout: 1h
      on_timeout: default
      default:
        approved: false

    - id: child
      subworkflow: ./child.yaml
      input:
        file: ${{ steps.discover.output.files[0].path }}
outputs:
  approved: ${{ steps.human_gate.output.approved }}
