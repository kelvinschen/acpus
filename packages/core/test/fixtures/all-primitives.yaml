version: 1
name: all-primitives
inputs:
  files: { type: array, required: true }
agents:
  coder: { type: mock, model: fixture }
workflow:
  steps:
    - id: discover
      run: program
      cmd: ["echo", "{\"files\":[{\"path\":\"a.ts\"}]}"]
      side_effects: read
      output: { from: stdout, parse: json }

    - id: review
      run: agent
      use: coder
      prompt: "Review ${{ steps.discover.output.files }}"
      expect:
        schema:
          type: object
          required: [issues]
          properties:
            issues:
              type: array

    - id: branches
      parallel:
        - id: left
          run: program
          cmd: ["echo", "left"]
        - id: right
          run: program
          cmd: ["echo", "right"]
      outputFrom: left

    - id: mapped
      fanout:
        over: ${{ steps.discover.output.files }}
        key: ${{ item.path }}
        join: all
        do:
          - id: inspect_one
            run: agent
            use: coder
            prompt: "Inspect ${{ item.path }}"
            expect:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
        outputFrom: inspect_one

    - id: route
      switch:
        cases:
          - when: ${{ len(steps.mapped.output) > 0 }}
            do:
              - id: route_yes
                run: program
                cmd: ["echo", "yes"]
        default:
          do:
            - id: route_no
              run: program
              cmd: ["echo", "no"]
      outputFrom: route_yes

    - id: fix_loop
      loop:
        until: ${{ coalesce(loop.last.ok, false) }}
        max_iterations: 2
        do:
          - id: fix_once
            run: agent
            use: coder
            prompt: "Fix round ${{ loop.iter }}"
            expect:
              schema: { type: object, required: [ok], properties: { ok: { type: boolean } } }
      outputFrom: fix_once

    - id: human_gate
      approval:
        prompt: "Approve?"
        timeout: 1h
        on_timeout: reject

    - id: child
      subworkflow: ./child.yaml
      inputs:
        file: ${{ steps.discover.output.files[0].path }}
      outputFrom: child_output
outputs:
  approved: ${{ steps.human_gate.output.approved }}
