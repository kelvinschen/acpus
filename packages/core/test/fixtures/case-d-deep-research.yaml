version: 1
name: deep-research
input:
  topic: string
  depth?: integer = 2
agents:
  planner:   { use: claude-code, model: opus-4 }
  collector: { use: opencode,    model: glm-4.6 }
  writer:    { use: codex,       model: gpt-5 }
workflow:
  steps:
    - id: plan
      run: agent
      use: planner
      prompt: |
        For topic "${{ input.topic }}", produce a research question tree with up to
        ${{ input.depth }} levels of sub-questions.
      output:
        leaves:
          - text: string

    - id: collect
      fanout:
        over: steps.plan.output.leaves
        key: "${{ item.text }}"
        max_concurrency: 8
        join: all
        do:
          - id: gather
            run: agent
            use: collector
            prompt: |
              Search the web for the question:
              ${{ item.text }}
            output:
              q: string
              findings:
                - url: string
                  snippet: string
            timeout: 8m
            retry: { max: 3 }

    - id: refine
      pipeline:
        - id: refine_loop
          loop:
            until: loop.iter > 0 && coalesce(loop.last.coverage, 0) >= 0.9
            max_iterations: 3
            do:
              - id: replan
                run: agent
                use: planner
                prompt: |
                  Given findings ${{ steps.collect.output }} and previous gaps
                  ${{ loop.iter == 0 ? [] : loop.last.gaps }}, propose follow-up sub-questions and an outline.
                output:
                  gaps:
                    - text: string
                  coverage: number
                  outline_md: string
              - id: merge
                run: program
                cmd: ["acpus-tool", "merge-findings", "--in", ".findings.json"]
                capture:
                  from: stdout
                  parse: json
      outputs:
        gaps: ${{ steps.refine_loop.output.gaps }}
        coverage: ${{ steps.refine_loop.output.coverage }}
        outline_md: ${{ steps.refine_loop.output.outline_md }}

    - id: human_outline
      run: signal
      prompt: |
        Outline:
        ${{ steps.refine.output.outline_md }}

        Coverage: ${{ steps.refine.output.coverage }}
        Approve writing?
      output:
        approved: boolean
      timeout: 6h
      on_timeout: default
      default:
        approved: false

    - id: write
      run: agent
      use: writer
      prompt: |
        Write a research report for "${{ input.topic }}"
        from outline ${{ steps.refine.output.outline_md }}.
      output:
        report_md: string
outputs:
  report: ${{ steps.write.output.report_md }}
