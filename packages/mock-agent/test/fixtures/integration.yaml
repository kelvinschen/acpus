version: 1
agent_id: acpus-integration-mock
deterministic_session_ids: true
allow_unknown_session_load: false
default_response:
  type: text
  text: "default integration ok"
rules:
  - name: sequence-rule
    when:
      prompt_contains: "retry me"
    sequence:
      - type: text
        text: "{bad json"
      - type: json
        payload:
          ok: true
          attempt: 2
  - name: prompt-count-rule
    when:
      prompt_count: 2
    respond:
      type: text
      text: "second prompt"
  - name: hang-rule
    when:
      prompt_contains: "hang"
    respond:
      type: hang
  - name: crash-rule
    when:
      prompt_contains: "crash"
    respond:
      type: text
      text: "crash response"
      stream:
        chunks: 3
        chunk_interval: 0ms
      crash_after_chunks: 1
      exit_code: 7
