version: 1
name: program-fanout-parallel-switch
input:
  items: [string]
workflow:
  steps:
    - id: prepare
      run: program
      cmd:
        - node
        - -e
        - |
          console.log(JSON.stringify({ count: Number(process.argv[1]), mode: process.argv[2] }))
        - ${{ len(input.items) }}
        - ${{ input.mode }}
      capture: { from: stdout, parse: json }
      output:
        count: integer
        mode: string

    - id: mapped
      fanout:
        over: input.items
        key: ${{ item }}
        do:
          - id: per_item
            parallel:
              - id: upper
                do:
                  - id: upper_value
                    run: program
                    cmd:
                      - node
                      - -e
                      - |
                        console.log(JSON.stringify({ item: process.argv[1], upper: process.argv[1].toUpperCase() }))
                      - ${{ item }}
                    capture: { from: stdout, parse: json }
                    output:
                      item: string
                      upper: string
              - id: routed
                do:
                  - id: route_item
                    switch:
                      cases:
                        - when: item == "alpha"
                          do:
                            - id: alpha_route
                              run: program
                              cmd: ["node", "-e", "console.log(JSON.stringify({ route: 'alpha', item: process.argv[1] }))", "${{ item }}"]
                              capture: { from: stdout, parse: json }
                              output:
                                route: string
                                item: string
                      default:
                        do:
                          - id: default_route
                            run: program
                            cmd: ["node", "-e", "console.log(JSON.stringify({ route: 'default', item: process.argv[1] }))", "${{ item }}"]
                            capture: { from: stdout, parse: json }
                            output:
                              route: string
                              item: string

    - id: summarize
      run: program
      cmd:
        - node
        - -e
        - |
          const lanes = JSON.parse(process.env.LANES);
          console.log(JSON.stringify({
            lane_count: lanes.length,
            routes: lanes.map((lane) => lane.routed.route),
            uppers: lanes.map((lane) => lane.upper.upper)
          }))
      env:
        LANES: ${{ json(steps.mapped.output) }}
      capture: { from: stdout, parse: json }
      output:
        lane_count: integer
        routes: [string]
        uppers: [string]
outputs:
  count: ${{ steps.prepare.output.count }}
  routes: ${{ steps.summarize.output.routes }}
  uppers: ${{ steps.summarize.output.uppers }}
