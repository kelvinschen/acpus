[workspace]
members = [
  "crates/acpus-spec",
  "crates/acpus-ir",
  "crates/acpus-expr",
  "crates/acpus-compiler",
  "crates/acpus-runtime-api",
  "crates/acpus-store",
  "crates/acpus-supervisor",
  "crates/acpus-testkit",
  "crates/acpus-core",
  "crates/acpus-runtime",
  "crates/acpus-cli",
  "crates/acpus-mock-agent",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kelvinschen/acpus"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
acpus-compiler = { path = "crates/acpus-compiler" }
acpus-core = { path = "crates/acpus-core" }
acpus-expr = { path = "crates/acpus-expr" }
acpus-ir = { path = "crates/acpus-ir" }
acpus-runtime = { path = "crates/acpus-runtime" }
acpus-runtime-api = { path = "crates/acpus-runtime-api" }
acpus-spec = { path = "crates/acpus-spec" }
acpus-store = { path = "crates/acpus-store" }
acpus-supervisor = { path = "crates/acpus-supervisor" }
acpus-testkit = { path = "crates/acpus-testkit" }
anyhow = "1.0.100"
axum = "0.8.9"
cel = { version = "0.13.0", features = ["json"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
hex = "0.4.3"
jsonrepair-rs = { version = "0.2.1", features = ["serde"] }
insta = { version = "1.43.2", features = ["json"] }
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version = "0.12.25", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
serde_yaml = { package = "noyalib", version = "0.0.8" }
sha2 = "0.10.9"
tempfile = "3.24.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
ts-rs = { version = "12.0.1", features = ["chrono-impl", "serde-json-impl"] }
utoipa = { version = "5.5.0", features = ["chrono", "axum_extras"] }
utoipa-axum = "0.2.0"
