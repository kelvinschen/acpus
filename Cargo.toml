[workspace]
members = [
  "crates/acpus-core",
  "crates/acpus-runtime",
  "crates/acpus-cli",
  "crates/acpus-mock-agent",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kelvinschen/acpus"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.9"
cel = { version = "0.13.0", features = ["json"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures-util = "0.3.32"
hex = "0.4.3"
jsonrepair-rs = { version = "0.2.1", features = ["serde"] }
rand = "0.9.2"
regex = "1.12.2"
reqwest = { version = "0.12.25", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
serde_yaml = { package = "noyalib", version = "0.0.8" }
sha2 = "0.10.9"
tempfile = "3.24.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
