version: 1
name: architecture-refactor-loop
description: |
  Dynamic workflow pattern: loop-until-done.

  Repeatedly finds architecture and test-quality deepening opportunities,
  applies behavior-preserving refactors in an isolated git worktree, verifies
  each round, and lets a verdict agent decide when no worthwhile Module
  deepening remains. Every round ends with a handoff document for the next
  round.

  Output: .acpus/output/architecture-refactor-loop/<run_id>/

input:
  target_path: string
  architecture_goal?: string = "Find behavior-preserving architecture refactors, remove duplicate low-value tests, and improve coverage of core behavior paths."
  base_ref?: string = "HEAD"
  verification_cmd?: string = "pnpm build && pnpm test"
  output_root?: string = ".acpus/output/architecture-refactor-loop"
  custom_instructions?: string = "(none)"
  apply_to_workspace?: boolean = true

agents:
  planner:
    use: traex
  implementer:
    use: traex
  reviewer:
    use: traex
  regression:
    use: traex
  verdict:
    use: traex
  summarizer:
    use: traex

workflow:
  steps:
    - id: setup_architecture_loop
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 - "${{ input.target_path }}" "${{ input.output_root }}" "${{ run_id }}" "${{ input.base_ref }}" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          target, root, run_id, base_ref = sys.argv[1:5]
          repo = pathlib.Path(target).resolve()
          out = pathlib.Path(root).resolve() / run_id
          worktree = out / "worktree"
          reports = out / "reports"
          logs = out / "logs"
          patches = out / "patches"
          for path in (reports, logs, patches):
              path.mkdir(parents=True, exist_ok=True)

          status = subprocess.run(["git", "-C", str(repo), "status", "--porcelain"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          base = subprocess.run(["git", "-C", str(repo), "rev-parse", "--verify", f"{base_ref}^{{commit}}"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          ok = status.returncode == 0 and base.returncode == 0 and status.stdout.strip() == ""
          created = False
          if ok:
              subprocess.run(["git", "-C", str(repo), "worktree", "remove", "--force", str(worktree)], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              create = subprocess.run(["git", "-C", str(repo), "worktree", "add", "--detach", str(worktree), base.stdout.strip()], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              created = create.returncode == 0
              ok = ok and created

          print(json.dumps({
              "ok": ok,
              "created": created,
              "repo_path": str(repo),
              "worktree_path": str(worktree),
              "output_dir": str(out),
              "reports_dir": str(reports),
              "logs_dir": str(logs),
              "patches_dir": str(patches),
              "base_sha": base.stdout.strip() if base.returncode == 0 else "",
              "dirty_status": status.stdout,
              "latest_patch_path": str(patches / "latest.patch"),
              "apply_log_path": str(logs / "apply-final.log"),
              "final_verify_log_path": str(logs / "final-verify.log"),
          }))
          PY
      capture:
        from: stdout
        parse: json
      output:
        ok: boolean
        created: boolean
        repo_path: string
        worktree_path: string
        output_dir: string
        reports_dir: string
        logs_dir: string
        patches_dir: string
        base_sha: string
        dirty_status: string
        latest_patch_path: string
        apply_log_path: string
        final_verify_log_path: string
      timeout: 10m

    - id: require_clean_workspace
      guard:
        when: steps.setup_architecture_loop.output.ok
        then: continue
        else: fail
        message: "Target workspace must be clean and architecture worktree must be created."

    - id: architecture_loop
      loop:
        until: loop.iter > 0 && coalesce(loop.last.output.done, false) && coalesce(loop.last.output.regression_ok, false)
        max_iterations: 10
        do:
          - id: plan
            run: agent
            use: planner
            prompt: |
              You are the plan agent for an Acpus architecture refactor loop.
              Work inside the isolated worktree only for repository reads and
              report writes.

              Repository worktree:
              ${{ steps.setup_architecture_loop.output.worktree_path }}

              Output reports directory:
              ${{ steps.setup_architecture_loop.output.reports_dir }}

              Round:
              ${{ loop.iter }}

              Architecture goal:
              ${{ input.architecture_goal }}

              Previous round handoff path:
              ${{ loop.iter == 0 ? "(first round; no handoff yet)" : loop.last.output.handoff_path }}

              Custom instructions:
              ${{ input.custom_instructions }}

              Required skill:
              - Use the `improve-codebase-architecture` skill from
                `/Users/bytedance/.agents/skills/improve-codebase-architecture/SKILL.md`.
                The agent runtime should auto-load the skill when this exact
                skill name is present.
              - Follow that skill's Module/Interface/Implementation/Depth/Seam/
                Adapter/Leverage/Locality vocabulary and deletion-test discipline.
              - Because this is a non-interactive Acpus Run, after producing the
                architecture candidate report, select the report's Top
                recommendation automatically for this round instead of waiting
                for a human candidate choice.
              - If the skill writes an HTML architecture report to the OS temp
                directory, reference its absolute path in the Markdown plan.

              Required project rules:
              - Read `AGENTS.md`, `CONTEXT.md`, and relevant `docs/adr/` files
                before deciding what to touch.
              - Use architecture vocabulary exactly: Module, Interface,
                Implementation, Depth, Seam, Adapter, Leverage, Locality.
              - Treat the codebase as active iteration. Do not add migration
                warnings, legacy diagnostics, compatibility shims, or
                backward-compatibility unless explicitly requested.
              - Plan only behavior-preserving refactors and test-quality
                changes. If a behavior change looks necessary, return
                `opportunity_found: false` and explain the blocker.
              - Apply the deletion test to suspected shallow Modules.
              - Prefer one narrow Module deepening per round.
              - Include test optimization only when it removes duplication,
                deletes low-value assertions, or improves core behavior-path
                coverage without weakening regression protection.

              Write a concise Markdown plan to:
              `${{ steps.setup_architecture_loop.output.reports_dir }}/round-${{ loop.iter }}-plan.md`

              Do not modify source or test files in this step.

              Return JSON with only control fields and the plan path. Put
              target details and verification focus in the Markdown plan.
            output:
              opportunity_found: boolean
              plan_path: string
              blocker?: string
            timeout: 60m

          - id: implement
            run: agent
            use: implementer
            prompt: |
              You are the implement agent for this architecture loop round.
              Modify only the isolated worktree.

              Worktree:
              ${{ steps.setup_architecture_loop.output.worktree_path }}

              Plan report:
              ${{ steps.plan.output.plan_path }}

              Round:
              ${{ loop.iter }}

              Rules:
              - Follow `AGENTS.md` and `CONTEXT.md`.
              - Keep all changes behavior-preserving.
              - Do not commit.
              - Do not stage files. Do not run `git add`,
                `git diff --cached`, or write anything under the
                patches directory. Patch artifact generation belongs
                only to the regression agent.
              - Do not edit the main workspace at
                `${{ steps.setup_architecture_loop.output.repo_path }}`.
              - If the plan has no safe opportunity, do not force a change.
              - Do not add compatibility shims, migration warnings, or legacy
                diagnostics.
              - If no SPEC update is needed, record why in the implementation
                report. If a SPEC update would be needed for correctness, stop
                and report the reason instead of changing behavior.
              - When changing tests, remove duplicate low-value tests only when
                the covered behavior remains protected elsewhere or is replaced
                by stronger core-path coverage.

              Write an implementation note to:
              `${{ steps.setup_architecture_loop.output.reports_dir }}/round-${{ loop.iter }}-implementation.md`

              Return JSON with control fields, report path, and SPEC impact.
              Put changed files, test changes, risks, and rationale in the
              implementation note.
            output:
              changed: boolean
              spec_update_required: boolean
              spec_update_reason: string
              implementation_report_path: string
            timeout: 60m

          - id: review
            run: agent
            use: reviewer
            prompt: |
              You are the review agent. Review the current worktree diff for
              behavior preservation, Module depth, test value, and project-rule
              compliance.

              Worktree:
              ${{ steps.setup_architecture_loop.output.worktree_path }}

              Plan report:
              ${{ steps.plan.output.plan_path }}

              Implementation report:
              ${{ steps.implement.output.implementation_report_path }}

              SPEC impact:
              required=${{ steps.implement.output.spec_update_required }}
              reason=${{ steps.implement.output.spec_update_reason }}

              Required review focus:
              - Does the change increase Locality and Leverage at a real Seam?
              - Is any Module still shallow after the change?
              - Did tests become stronger on core behavior paths, not merely
                broader by count?
              - Were duplicate or low-value tests removed only when safe?
              - Did the implementation avoid behavior changes and compatibility
                shims?
              - If no SPEC update was made, is the stated reason valid?

              Write the full Markdown review to:
              `${{ steps.setup_architecture_loop.output.reports_dir }}/round-${{ loop.iter }}-review.md`

              Do not modify source or test files in this step.

              Return JSON with approval, report path, and blocking count. Put
              concrete findings and assessments in the Markdown review.
            output:
              approved: boolean
              report_path: string
              blocking_count: integer
            timeout: 60m

          - id: regression
            run: agent
            use: regression
            prompt: |
              You are the regression agent. Run the regression verification and
              inspect the current worktree diff yourself. Decide whether this
              round is regression-safe and whether the test suite improved.

              Worktree:
              ${{ steps.setup_architecture_loop.output.worktree_path }}

              Verification command:
              ${{ input.verification_cmd }}

              Verification log path:
              ${{ steps.setup_architecture_loop.output.logs_dir }}/round-${{ loop.iter }}-verify.log

              Round patch path:
              ${{ steps.setup_architecture_loop.output.patches_dir }}/round-${{ loop.iter }}.patch

              Latest patch path:
              ${{ steps.setup_architecture_loop.output.latest_patch_path }}

              Plan report:
              ${{ steps.plan.output.plan_path }}

              Review report:
              ${{ steps.review.output.report_path }}

              Review approved:
              ${{ steps.review.output.approved }}

              Required focus:
              - Run the verification command from the worktree and write its
                combined output to the verification log path.
              - Write `git diff --binary` from the worktree to both patch paths.
              - Collect changed files with `git diff --name-only`.
              - Collect numstat with `git diff --numstat`.
              - Functional behavior must remain unchanged.
              - Verification command must pass.
              - Test deletions must not remove the only coverage of a current
                behavior.
              - New or changed tests should cover core behavior paths through
                the relevant Interface, not incidental Implementation details.
              - Do not fix the code in this step. You may only write the
                regression report, verification log, and patch files.

              Write a Markdown regression report to:
              `${{ steps.setup_architecture_loop.output.reports_dir }}/round-${{ loop.iter }}-regression.md`

              Return JSON with regression control fields and artifact paths.
              Put changed files, numstat, coverage assessment, behavior risk,
              and follow-ups in the Markdown regression report.
            output:
              ok: boolean
              report_path: string
              verification_ok: boolean
              verify_exit_code: integer
              verify_log_path: string
              latest_patch_path: string
              round_patch_path: string
              has_patch: boolean
            timeout: 60m

          - id: verdict
            run: agent
            use: verdict
            prompt: |
              You are the verdict agent controlling this architecture refactor
              loop. Decide whether the loop should stop or continue.

              Worktree:
              ${{ steps.setup_architecture_loop.output.worktree_path }}

              Round:
              ${{ loop.iter }}

              Plan report:
              ${{ steps.plan.output.plan_path }}

              Opportunity found:
              ${{ steps.plan.output.opportunity_found }}

              Implementation report:
              ${{ steps.implement.output.implementation_report_path }}

              Implementation changed:
              ${{ steps.implement.output.changed }}

              Review report:
              ${{ steps.review.output.report_path }}

              Review approved:
              ${{ steps.review.output.approved }}

              Blocking finding count:
              ${{ steps.review.output.blocking_count }}

              Regression result:
              ok=${{ steps.regression.output.ok }}
              verification_ok=${{ steps.regression.output.verification_ok }}
              exit=${{ steps.regression.output.verify_exit_code }}
              log=${{ steps.regression.output.verify_log_path }}
              patch=${{ steps.regression.output.latest_patch_path }}
              has_patch=${{ steps.regression.output.has_patch }}
              report=${{ steps.regression.output.report_path }}

              Regression report path:
              ${{ steps.regression.output.report_path }}

              Regression ok:
              ${{ steps.regression.output.ok }}

              Stop only when:
              - deterministic regression passed,
              - the review has no blocking findings,
              - the current patch is acceptable or there was no safe opportunity,
              - and there is no remaining worthwhile behavior-preserving Module
                deepening or test-quality improvement within the stated goal.

              Continue when:
              - regression failed,
              - review found blocking issues,
              - the current round revealed a sharper next Module to deepen,
              - or useful core-path test coverage work remains.

              Required handoff:
              - Invoke the handoff skill at
                `/Users/bytedance/.agents/skills/handoff/SKILL.md`.
              - Save the handoff document to the OS temporary directory as the
                skill requires.
              - In the handoff document's suggested skills section, include
                `improve-codebase-architecture` and `handoff`.
              - Tailor it for the next loop round.
              - Reference reports, patches, and logs by path instead of
                duplicating them.
              - Return the handoff document absolute path as `handoff_path`.

              Write a Markdown verdict report to:
              `${{ steps.setup_architecture_loop.output.reports_dir }}/round-${{ loop.iter }}-verdict.md`

              Return JSON with only loop control fields and durable report or
              handoff paths. Put remaining opportunities in the verdict report
              and handoff document.
            output:
              done: boolean
              regression_ok: boolean
              accepted_current_patch: boolean
              handoff_path: string
              verdict_report_path: string
              stop_reason: string
              continue_reason: string
            timeout: 60m

    - id: require_loop_verdict
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 - "${{ run_id }}" <<'PY'
          import json
          import pathlib
          import sys

          run_id = sys.argv[1]
          state_path = pathlib.Path(".acpus/state/runs") / run_id / "nodes" / "workflow:architecture_loop.json"
          state = json.loads(state_path.read_text(encoding="utf-8"))
          loop_output = state.get("output") or {}
          verdict = loop_output.get("output", loop_output) if isinstance(loop_output, dict) else {}
          print(json.dumps({
              "done": bool(verdict.get("done")),
              "regression_ok": bool(verdict.get("regression_ok")),
              "accepted_current_patch": bool(verdict.get("accepted_current_patch")),
              "handoff_path": str(verdict.get("handoff_path", "")),
              "verdict_report_path": str(verdict.get("verdict_report_path", "")),
              "stop_reason": str(verdict.get("stop_reason", "")),
              "continue_reason": str(verdict.get("continue_reason", "")),
          }))
          PY
      capture:
        from: stdout
        parse: json
      output:
        done: boolean
        regression_ok: boolean
        accepted_current_patch: boolean
        handoff_path: string
        verdict_report_path: string
        stop_reason: string
        continue_reason: string
      timeout: 5m

    - id: require_loop_clean_stop
      guard:
        when: steps.require_loop_verdict.output.done && steps.require_loop_verdict.output.regression_ok
        then: continue
        else: fail
        message: "Architecture loop exhausted 10 rounds without a clean stop verdict."

    - id: finalize_patch
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          repo="${{ steps.setup_architecture_loop.output.repo_path }}"
          patch="${{ steps.setup_architecture_loop.output.latest_patch_path }}"
          apply_log="${{ steps.setup_architecture_loop.output.apply_log_path }}"
          verify_log="${{ steps.setup_architecture_loop.output.final_verify_log_path }}"
          verify="${{ input.verification_cmd }}"
          apply_to_workspace="${{ input.apply_to_workspace }}"
          python3 - "$repo" "$patch" "$apply_log" "$verify_log" "$verify" "$apply_to_workspace" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          repo, patch, apply_log, verify_log, verify, apply_to_workspace = sys.argv[1:7]
          repo_path = pathlib.Path(repo)
          patch_path = pathlib.Path(patch)
          apply_log_path = pathlib.Path(apply_log)
          verify_log_path = pathlib.Path(verify_log)
          apply_enabled = apply_to_workspace == "true"
          has_patch = patch_path.is_file() and patch_path.stat().st_size > 0
          result = {
              "ok": False,
              "applied": False,
              "verified": False,
              "rolled_back": False,
              "skipped_apply": not apply_enabled,
              "no_changes": not has_patch,
              "verify_exit_code": -1,
              "apply_log_path": str(apply_log_path),
              "final_verify_log_path": str(verify_log_path),
          }

          if not has_patch:
              apply_log_path.write_text("no patch produced; no workspace changes to apply\n", encoding="utf-8")
              result["ok"] = True
              result["verified"] = True
          elif not apply_enabled:
              apply_log_path.write_text(f"apply_to_workspace=false; patch left at {patch_path}\n", encoding="utf-8")
              result["ok"] = True
          else:
              status = subprocess.run(["git", "-C", str(repo_path), "status", "--porcelain"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              if status.stdout.strip():
                  apply_log_path.write_text("workspace is dirty; refusing to apply architecture patch\n" + status.stdout, encoding="utf-8")
              else:
                  apply = subprocess.run(["git", "-C", str(repo_path), "apply", "--whitespace=nowarn", str(patch_path)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  apply_log_path.write_text(apply.stdout, encoding="utf-8")
                  result["applied"] = apply.returncode == 0
                  if result["applied"]:
                      verify_result = subprocess.run(["bash", "-c", verify], cwd=repo_path, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                      verify_log_path.write_text(verify_result.stdout, encoding="utf-8")
                      result["verified"] = verify_result.returncode == 0
                      result["verify_exit_code"] = verify_result.returncode
                      result["ok"] = result["verified"]
                      if not result["verified"]:
                          rollback = subprocess.run(["git", "-C", str(repo_path), "apply", "-R", "--whitespace=nowarn", str(patch_path)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                          with apply_log_path.open("a", encoding="utf-8") as log:
                              log.write("\nfinal verification failed; rolling back applied patch\n")
                              log.write(rollback.stdout)
                          result["rolled_back"] = rollback.returncode == 0

          print(json.dumps(result))
          PY
      capture:
        from: stdout
        parse: json
      output:
        ok: boolean
        applied: boolean
        verified: boolean
        rolled_back: boolean
        skipped_apply: boolean
        no_changes: boolean
        verify_exit_code: integer
        apply_log_path: string
        final_verify_log_path: string
      timeout: 60m

    - id: require_finalized
      guard:
        when: steps.finalize_patch.output.ok
        then: continue
        else: fail
        message: "Final architecture patch was not applied or final verification failed."

    - id: summarize_changes
      run: agent
      use: summarizer
      prompt: |
        You are the final summarize agent for this architecture refactor loop.
        Read all available loop outputs and write the durable change document.

        Repository:
        ${{ steps.setup_architecture_loop.output.repo_path }}

        Worktree:
        ${{ steps.setup_architecture_loop.output.worktree_path }}

        Output directory:
        ${{ steps.setup_architecture_loop.output.output_dir }}

        Reports directory:
        ${{ steps.setup_architecture_loop.output.reports_dir }}

        Logs directory:
        ${{ steps.setup_architecture_loop.output.logs_dir }}

        Patches directory:
        ${{ steps.setup_architecture_loop.output.patches_dir }}

        Latest patch:
        ${{ steps.setup_architecture_loop.output.latest_patch_path }}

        Final verification log:
        ${{ steps.finalize_patch.output.final_verify_log_path }}

        Apply log:
        ${{ steps.finalize_patch.output.apply_log_path }}

        Final loop verdict:
        done=${{ steps.require_loop_verdict.output.done }}
        regression_ok=${{ steps.require_loop_verdict.output.regression_ok }}
        accepted_current_patch=${{ steps.require_loop_verdict.output.accepted_current_patch }}
        stop_reason=${{ steps.require_loop_verdict.output.stop_reason }}
        continue_reason=${{ steps.require_loop_verdict.output.continue_reason }}
        handoff_path=${{ steps.require_loop_verdict.output.handoff_path }}
        verdict_report_path=${{ steps.require_loop_verdict.output.verdict_report_path }}

        Finalization:
        ok=${{ steps.finalize_patch.output.ok }}
        applied=${{ steps.finalize_patch.output.applied }}
        verified=${{ steps.finalize_patch.output.verified }}
        rolled_back=${{ steps.finalize_patch.output.rolled_back }}
        skipped_apply=${{ steps.finalize_patch.output.skipped_apply }}
        no_changes=${{ steps.finalize_patch.output.no_changes }}
        verify_exit_code=${{ steps.finalize_patch.output.verify_exit_code }}

        Required work:
        - Read the round plan, implementation, review, regression, and verdict
          reports from the reports directory.
        - Read the handoff document if `handoff_path` is non-empty and exists.
        - Read the latest patch and final logs when they exist.
        - Write a concise Markdown change document to:
          `${{ steps.setup_architecture_loop.output.reports_dir }}/final-change-summary.md`
        - The document MUST summarize:
          - what architecture Module deepening was attempted or completed,
          - what source/test files changed,
          - what duplicate or low-value tests were removed, if any,
          - what core behavior-path coverage improved, if any,
          - whether the patch was applied to the main workspace,
          - final regression status and verification evidence,
          - SPEC impact and why a SPEC update was or was not required,
          - remaining opportunities from the verdict report or why the
            verdict stopped the loop.
        - Use Acpus terminology from `CONTEXT.md` and architecture vocabulary:
          Module, Interface, Implementation, Depth, Seam, Adapter, Leverage,
          Locality.
        - Do not modify source files, tests, specs, or git state in this step.
          Only write the final change document.

        Return JSON with the document path and compact control fields. Put
        remaining opportunities in the Markdown document.
      output:
        summary_path: string
        applied: boolean
        no_changes: boolean
        verification_ok: boolean
      timeout: 60m

outputs:
  output_dir: ${{ steps.setup_architecture_loop.output.output_dir }}
  worktree_path: ${{ steps.setup_architecture_loop.output.worktree_path }}
  patch_path: ${{ steps.setup_architecture_loop.output.latest_patch_path }}
  final_verify_log_path: ${{ steps.finalize_patch.output.final_verify_log_path }}
  applied: ${{ steps.finalize_patch.output.applied }}
  no_changes: ${{ steps.finalize_patch.output.no_changes }}
  handoff_path: ${{ steps.require_loop_verdict.output.handoff_path }}
  summary_path: ${{ steps.summarize_changes.output.summary_path }}
