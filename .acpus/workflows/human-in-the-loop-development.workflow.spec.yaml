version: 1
name: human-in-the-loop-development
description: |
  Human-in-the-loop iterative development: plan → implement → review → route,
  looping until a human approves.

  Each round a planner turns the task (and the previous round's feedback) into a
  concrete plan, an implementer edits the target repository, and a reviewer
  inspects the working-tree diff and votes approve / request-changes. The route
  decides what happens next:

    - reviewer requests changes  → carry the reviewer feedback into the next
      round (no human is bothered).
    - reviewer approves          → a Signal Node blocks for a HUMAN review. The
      human is only pulled in once the machine already believes the work is
      ready.
        - human approves         → the loop completes and a summarizer writes
          the final report.
        - human rejects          → the human's rejection reason is carried into
          the next round so the planner, implementer, and reviewer all fix and
          re-review against exactly what the human objected to.

  Why this is genuinely human-in-the-loop (not a rubber stamp): the human's
  decision feeds back into execution. A rejection is not the end of the run — it
  becomes the next round's input. Approval is the only way the loop finishes.

  Cross-round memory: planner / implementer / reviewer each keep a fixed
  session_key so the same role remembers what it did in prior rounds; the merged
  feedback is ALSO passed explicitly in the prompt as a belt-and-suspenders.

  The implementer edits the REAL working tree at `target_path`. Run this against
  a repo where uncommitted changes are acceptable (ideally a dedicated branch or
  worktree).

  Deliver the human decision via:
    acpus runs signal <run_id> --node workflow/dev_loop/route/human_gate \
      --payload '{"approved": true, "notes": "ship it"}'
    acpus runs signal <run_id> --node workflow/dev_loop/route/human_gate \
      --payload '{"approved": false, "notes": "the error path is still wrong"}'

  Override agents via CLI, e.g.:
    --agents '{"planner":{"use":"pi"},"implementer":{"use":"claude"},"reviewer":{"use":"pi"},"summarizer":{"use":"pi"}}'

  Output: .acpus/output/human-in-the-loop-development/<run_id>/

input:
  task: string
  target_path?: string = "."
  acceptance_criteria?: string = "(none specified — use your engineering judgment)"
  output_root?: string = ".acpus/output/human-in-the-loop-development"

agents:
  planner:
    use: pi
  implementer:
    use: pi
    # Run inside the target repo so edits land in the working tree under review.
    cwd: "${{ input.target_path }}"
  reviewer:
    use: pi
    # Review the target repo's working-tree diff, not this host project.
    cwd: "${{ input.target_path }}"
  summarizer:
    use: pi

workflow:
  steps:
    # ── Prepare a durable output directory for this run ──
    - id: prepare
      run: program
      env:
        HITL_ROOT: "${{ input.output_root }}"
        HITL_RUN_ID: "${{ run_id }}"
        HITL_TARGET: "${{ input.target_path }}"
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 <<'PY'
          import json, os, pathlib
          root = os.environ["HITL_ROOT"]
          run_id = os.environ["HITL_RUN_ID"]
          target = os.environ["HITL_TARGET"]
          out = pathlib.Path(root).resolve() / run_id
          out.mkdir(parents=True, exist_ok=True)
          print(json.dumps({
              "output_dir": str(out),
              "target_path": str(pathlib.Path(target).resolve()),
              "feedback_log": str(out / "feedback-log.jsonl"),
          }))
          PY
      capture:
        from: stdout
        parse: json
      output:
        output_dir: string
        target_path: string
        feedback_log: string
      timeout: 1m

    # ── Iterative develop → review → human-gate loop ──
    - id: dev_loop
      loop:
        # max_iterations must be a numeric literal (no expressions); this is the
        # round cap that bounds the loop when the human never approves.
        max_iterations: 5
        do:
          # ── Plan this round from the task + prior round's merged feedback ──
          - id: plan
            run: agent
            use: planner
            session_key: "hitl-dev-planner"
            prompt: |
              You are the PLANNER in an iterative human-in-the-loop dev loop.
              Round: ${{ loop.iter }}

              ## Task
              ${{ input.task }}

              ## Acceptance criteria
              ${{ input.acceptance_criteria }}

              ## Target repository
              `${{ steps.prepare.output.target_path }}`

              ## Feedback from the previous round
              ${{ loop.iter == 0 ? "(first round — no prior feedback)" : json(loop.last.output) }}

              On round 0, produce the initial implementation plan. On later
              rounds, the feedback above is the reason the previous attempt was
              NOT accepted (by the reviewer or by the human — see its `source`
              and `feedback` fields). Revise the plan to address it directly;
              do not re-propose what was already rejected.

              Produce a concrete, ordered plan: the files to touch and the
              specific change in each. Write the plan to:
              ${{ steps.prepare.output.output_dir }}/plan-round-${{ loop.iter }}.md

              Return JSON with the plan path and a one-line summary.
            output:
              plan_path: string
              summary: string
            timeout: 20m

          # ── Implement the plan by editing the real working tree ──
          - id: implement
            run: agent
            use: implementer
            session_key: "hitl-dev-implementer"
            prompt: |
              You are the IMPLEMENTER in an iterative human-in-the-loop dev loop.
              Round: ${{ loop.iter }}

              ## Task
              ${{ input.task }}

              ## This round's plan
              Read and follow: ${{ steps.plan.output.plan_path }}

              ## Feedback from the previous round
              ${{ loop.iter == 0 ? "(first round — no prior feedback)" : json(loop.last.output) }}

              Implement the plan by editing files in the current working
              directory (the target repository). Make the smallest correct
              change set. Keep the build/tests green if a test command is
              obvious. Do NOT commit; leave changes in the working tree so the
              reviewer can diff them.

              Return JSON with a short summary of what you changed and the list
              of files you touched.
            output:
              summary: string
              changed_files: [string]
            timeout: 40m

          # ── Review the working-tree diff and vote ──
          - id: review
            run: agent
            use: reviewer
            session_key: "hitl-dev-reviewer"
            prompt: |
              You are the REVIEWER in an iterative human-in-the-loop dev loop.
              Round: ${{ loop.iter }}

              ## Task
              ${{ input.task }}

              ## Acceptance criteria
              ${{ input.acceptance_criteria }}

              ## What to review
              Inspect THIS round's changes in the current working directory:
                git -C . status
                git -C . diff
              Also open the changed files and their neighbors. Cite file paths
              and line numbers. Verify the change actually satisfies the task and
              acceptance criteria — correctness first, then design and craft.

              ## Feedback from the previous round
              ${{ loop.iter == 0 ? "(first round — no prior feedback)" : json(loop.last.output) }}

              Decide: does this change deserve to be promoted to a HUMAN review?
              Set `approved: true` ONLY if you would stake your name on it.
              Otherwise set `approved: false` and give specific, actionable
              feedback the implementer can act on next round.

              Write your full review to:
              ${{ steps.prepare.output.output_dir }}/review-round-${{ loop.iter }}.md

              Return JSON: approved (bool), feedback (string — the actionable
              summary), and report_path.
            output:
              approved: boolean
              feedback: string
              report_path: string
            timeout: 30m

          # ── Route: reviewer-approved work goes to a human; rejected work is
          #    carried straight to the next round. Both branches emit the same
          #    {approved, source, feedback} shape so downstream nodes are stable.
          - id: route
            switch:
              cases:
                - when: steps.review.output.approved
                  do:
                    # ── Human stays in the loop: block for an external decision ──
                    - id: human_gate
                      run: signal
                      prompt: |
                        The reviewer APPROVED round ${{ loop.iter }} and is
                        promoting it for your review.

                        Reviewer feedback: ${{ steps.review.output.feedback }}
                        Review report: ${{ steps.review.output.report_path }}
                        Plan: ${{ steps.plan.output.plan_path }}

                        Inspect the working tree at:
                        ${{ steps.prepare.output.target_path }}

                        Deliver your decision as a JSON payload:
                          approved: true  to accept and finish the loop
                          approved: false to send it back for another round
                          notes:    your reasoning. When rejecting, be specific —
                                    this text is fed to the planner, implementer,
                                    and reviewer as the thing they must fix.
                      output:
                        approved: boolean
                        notes: string
                    # ── Normalize the human decision into the merged shape ──
                    - id: human_outcome
                      run: program
                      env:
                        HITL_APPROVED: "${{ steps.human_gate.output.approved }}"
                        HITL_NOTES: "${{ steps.human_gate.output.notes }}"
                      cmd:
                        - bash
                        - -c
                        - |
                          set -euo pipefail
                          python3 <<'PY'
                          import json, os
                          approved = os.environ.get("HITL_APPROVED", "").strip().lower() == "true"
                          print(json.dumps({
                              "approved": approved,
                              "source": "human",
                              "feedback": os.environ.get("HITL_NOTES", ""),
                          }))
                          PY
                      capture:
                        from: stdout
                        parse: json
                      output:
                        approved: boolean
                        source: string
                        feedback: string
                      timeout: 1m
              default:
                do:
                  # ── Reviewer rejected: carry its feedback to the next round ──
                  - id: reviewer_outcome
                    run: program
                    env:
                      HITL_FEEDBACK: "${{ steps.review.output.feedback }}"
                    cmd:
                      - bash
                      - -c
                      - |
                        set -euo pipefail
                        python3 <<'PY'
                        import json, os
                        print(json.dumps({
                            "approved": False,
                            "source": "reviewer",
                            "feedback": os.environ.get("HITL_FEEDBACK", ""),
                        }))
                        PY
                    capture:
                      from: stdout
                      parse: json
                    output:
                      approved: boolean
                      source: string
                      feedback: string
                    timeout: 1m

          # ── Merge this round's outcome into the durable feedback log. The
          #    loop carries THIS node's output as loop.last to the next round.
          - id: collect_feedback
            run: program
            env:
              HITL_LOG: "${{ steps.prepare.output.feedback_log }}"
              HITL_ROUND: "${{ loop.iter }}"
              HITL_OUTCOME: "${{ json(steps.route.output) }}"
            cmd:
              - bash
              - -c
              - |
                set -euo pipefail
                python3 <<'PY'
                import json, os
                log_path = os.environ["HITL_LOG"]
                rnd = int(os.environ.get("HITL_ROUND", "0"))
                outcome = json.loads(os.environ["HITL_OUTCOME"])
                # The switch output is the selected branch's final child value;
                # unwrap the program envelope ({ output: {...} }) when present.
                if isinstance(outcome, dict) and "output" in outcome and isinstance(outcome["output"], dict):
                    outcome = outcome["output"]
                record = {
                    "round": rnd,
                    "approved": bool(outcome.get("approved", False)),
                    "source": outcome.get("source", "reviewer"),
                    "feedback": outcome.get("feedback", ""),
                }
                with open(log_path, "a", encoding="utf-8") as f:
                    f.write(json.dumps(record) + "\n")
                print(json.dumps(record))
                PY
            capture:
              from: stdout
              parse: json
            output:
              round: integer
              approved: boolean
              source: string
              feedback: string
            timeout: 1m

          # ── Terminate the loop when this round is human-approved ──
          - id: decide
            guard:
              when: steps.collect_feedback.output.approved
              then: complete
              else: continue
              message: "round ${{ loop.iter }} not approved; continuing"

    # ── Summarize the whole development effort ──
    - id: summarize
      run: agent
      use: summarizer
      session_key: "hitl-dev-summarizer"
      prompt: |
        You are the SUMMARIZER. The iterative development loop has ended.

        ## Task
        ${{ input.task }}

        ## Final round outcome
        ${{ json(steps.dev_loop.output) }}

        ## Full per-round feedback log (JSONL)
        Read: ${{ steps.prepare.output.feedback_log }}

        Determine the final state:
          - If the last recorded round was human-approved, report SHIPPED and
            summarize what was built and how many rounds it took.
          - Otherwise the loop hit the round cap (5 rounds) without human
            approval — report NOT APPROVED, summarize the outstanding
            objections from the feedback log, and recommend next steps.

        Write the final report to:
        ${{ steps.prepare.output.output_dir }}/summary.md

        Return JSON with the final status and the report path.
      output:
        status: string
        report_path: string
      timeout: 20m

outputs:
  final_round: ${{ steps.dev_loop.output }}
  summary_status: ${{ steps.summarize.output.status }}
  summary_report: ${{ steps.summarize.output.report_path }}
  output_dir: ${{ steps.prepare.output.output_dir }}
  feedback_log: ${{ steps.prepare.output.feedback_log }}
