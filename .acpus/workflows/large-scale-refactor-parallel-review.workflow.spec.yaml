version: 1
name: large-scale-refactor-parallel-review
description: |
  Large-scale parallel adversarial review for broad refactors.

  This workflow is designed for greenfield breaking changes that touch runtime
  behavior, specs, docs, examples, and tests at the same time. It collects a
  deterministic git review packet, runs independent reviewers across focused
  domains, then synthesizes a final release-readiness verdict.

  Output: .acpus/output/large-scale-refactor-parallel-review/<run_id>/

input:
  target_path: string
  refactor_goal: string
  base_ref?: string = "HEAD~1"
  implementation_ref?: string = "HEAD"
  review_depth?: string = "exhaustive"
  review_instructions?: string = "(none)"
  output_root?: string = ".acpus/output/large-scale-refactor-parallel-review"

agents:
  reviewer:
    use: traex
  synthesizer:
    use: pi

workflow:
  steps:
    - id: collect_context
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          target="${{ input.target_path }}"
          root="${{ input.output_root }}"
          run_id="${{ run_id }}"
          python3 - "$target" "$root" "$run_id" "${{ input.base_ref }}" "${{ input.implementation_ref }}" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          target, root, run_id, base_ref, head_ref = sys.argv[1:6]
          target_path = pathlib.Path(target).resolve()
          out = pathlib.Path(root).resolve() / run_id
          out.mkdir(parents=True, exist_ok=True)

          def git(*args):
              return subprocess.run(
                  ["git", "-C", str(target_path), *args],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              ).stdout

          def write_text(path, text):
              path.write_text(text, encoding="utf-8")
              return str(path)

          base_sha = git("rev-parse", "--verify", f"{base_ref}^{{commit}}").strip()
          head_sha = git("rev-parse", "--verify", f"{head_ref}^{{commit}}").strip()
          changed = git("diff", "--name-only", base_sha, head_sha)
          diff_stat = git("diff", "--stat", base_sha, head_sha)
          patch = git("diff", base_sha, head_sha)
          name_status = git("diff", "--name-status", base_sha, head_sha)

          changed_files = [line for line in changed.splitlines() if line.strip()]

          def in_prefix(path, *prefixes):
              return any(path == prefix or path.startswith(prefix + "/") for prefix in prefixes)

          def has_ext(path, *exts):
              return pathlib.PurePosixPath(path).suffix.lower() in exts

          categories = {
              "code": [],
              "runtime_core": [],
              "api_cli_supervisor": [],
              "spec_docs": [],
              "examples_workflows": [],
              "tests": [],
              "build_packaging": [],
              "skills_agent_docs": [],
              "other": [],
          }

          for path in changed_files:
              matched = False
              if in_prefix(path, "packages/runtime", "packages/core"):
                  categories["runtime_core"].append(path)
                  matched = True
              if in_prefix(path, "packages/cli", "packages/supervisor", "packages/tui"):
                  categories["api_cli_supervisor"].append(path)
                  matched = True
              if in_prefix(path, "specs") or path in {"README.md", "CONTEXT.md", "AGENTS.md"} or in_prefix(path, "docs"):
                  categories["spec_docs"].append(path)
                  matched = True
              if in_prefix(path, ".acpus/workflows", "examples", "fixtures") or path.endswith((".workflow.yaml", ".workflow.yml", ".workflow.spec.yaml", ".workflow.spec.yml")):
                  categories["examples_workflows"].append(path)
                  matched = True
              if "/test/" in path or "/tests/" in path or path.endswith((".test.ts", ".test.tsx", ".spec.ts", ".spec.tsx")):
                  categories["tests"].append(path)
                  matched = True
              if path in {"package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "tsconfig.json"} or path.startswith("scripts/") or path.endswith((".config.ts", ".config.js")):
                  categories["build_packaging"].append(path)
                  matched = True
              if in_prefix(path, ".acpus/skills", ".codex/skills") or path.endswith("SKILL.md"):
                  categories["skills_agent_docs"].append(path)
                  matched = True
              if has_ext(path, ".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs"):
                  categories["code"].append(path)
                  matched = True
              if not matched:
                  categories["other"].append(path)

          category_counts = {name: len(paths) for name, paths in categories.items()}

          changed_path = out / "changed-files.txt"
          status_path = out / "name-status.txt"
          stat_path = out / "diff-stat.txt"
          patch_path = out / "implementation.diff"
          categories_path = out / "changed-file-categories.json"
          brief_path = out / "review-brief.md"

          reports = {
              "runtime_implementation": str(out / "runtime-implementation.md"),
              "api_contract": str(out / "api-contract.md"),
              "dataflow_state": str(out / "dataflow-state.md"),
              "docs_truth": str(out / "docs-truth.md"),
              "spec_rfc2119": str(out / "spec-rfc2119.md"),
              "examples_workflows": str(out / "examples-workflows.md"),
              "test_correctness": str(out / "test-correctness.md"),
              "test_coverage_gaps": str(out / "test-coverage-gaps.md"),
              "build_packaging": str(out / "build-packaging.md"),
              "observability_dx": str(out / "observability-dx.md"),
              "final": str(out / "final-cross-examination.md"),
          }

          write_text(changed_path, changed)
          write_text(status_path, name_status)
          write_text(stat_path, diff_stat)
          write_text(patch_path, patch)
          write_text(categories_path, json.dumps(categories, indent=2, sort_keys=True) + "\n")

          brief_lines = [
              "# Large-Scale Refactor Review Brief",
              "",
              f"- Target: `{target_path}`",
              f"- Base: `{base_ref}` -> `{base_sha}`",
              f"- Head: `{head_ref}` -> `{head_sha}`",
              f"- Changed files: {len(changed_files)}",
              "",
              "## Category Counts",
              "",
          ]
          for name, count in category_counts.items():
              brief_lines.append(f"- {name}: {count}")
          brief_lines.extend([
              "",
              "## Artifacts",
              "",
              f"- Changed files: `{changed_path}`",
              f"- Name status: `{status_path}`",
              f"- Diff stat: `{stat_path}`",
              f"- Patch: `{patch_path}`",
              f"- Categories: `{categories_path}`",
              "",
              "## Review Reports",
              "",
          ])
          for name, path in reports.items():
              brief_lines.append(f"- {name}: `{path}`")
          write_text(brief_path, "\n".join(brief_lines) + "\n")

          print(json.dumps({
              "output_dir": str(out),
              "target_path": str(target_path),
              "base_sha": base_sha,
              "head_sha": head_sha,
              "changed_files_path": str(changed_path),
              "name_status_path": str(status_path),
              "diff_stat_path": str(stat_path),
              "patch_path": str(patch_path),
              "categories_path": str(categories_path),
              "brief_path": str(brief_path),
              "changed_file_count": len(changed_files),
              "category_counts": category_counts,
              "reports": reports,
          }))
          PY
      capture:
        from: stdout
        parse: json
      output:
        output_dir: string
        target_path: string
        base_sha: string
        head_sha: string
        changed_files_path: string
        name_status_path: string
        diff_stat_path: string
        patch_path: string
        categories_path: string
        brief_path: string
        changed_file_count: integer
        category_counts:
          code: integer
          runtime_core: integer
          api_cli_supervisor: integer
          spec_docs: integer
          examples_workflows: integer
          tests: integer
          build_packaging: integer
          skills_agent_docs: integer
          other: integer
        reports:
          runtime_implementation: string
          api_contract: string
          dataflow_state: string
          docs_truth: string
          spec_rfc2119: string
          examples_workflows: string
          test_correctness: string
          test_coverage_gaps: string
          build_packaging: string
          observability_dx: string
          final: string
      timeout: 5m

    - id: require_changed_files
      guard:
        when: steps.collect_context.output.changed_file_count > 0
        then: continue
        else: fail
        message: "No changed files found for ${{ input.base_ref }}..${{ input.implementation_ref }}."

    - id: refactor_reviews
      parallel:
        - id: runtime_implementation
          run: agent
          use: reviewer
          prompt: |
            You are the runtime implementation reviewer for a large Acpus refactor.
            Focus on executable behavior in runtime/core code, not prose.

            Refactor goal:
            ${{ input.refactor_goal }}

            Review packet:
            - Repository: `${{ steps.collect_context.output.target_path }}`
            - Brief: ${{ steps.collect_context.output.brief_path }}
            - Changed files: ${{ steps.collect_context.output.changed_files_path }}
            - Categories: ${{ steps.collect_context.output.categories_path }}
            - Patch: ${{ steps.collect_context.output.patch_path }}
            - Depth: ${{ input.review_depth }}

            Audit implementation correctness, type boundaries, output shapes,
            state persistence, replay behavior, error propagation, and runtime
            invariants. Prefer findings that can break real runs.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.runtime_implementation }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 45m

        - id: api_contract
          run: agent
          use: reviewer
          prompt: |
            You are the public contract reviewer. Focus on user-visible behavior:
            Workflow Spec semantics, CLI/supervisor APIs, output contracts, and
            persistence surfaces.

            Refactor goal:
            ${{ input.refactor_goal }}

            Review packet:
            - Repository: `${{ steps.collect_context.output.target_path }}`
            - Brief: ${{ steps.collect_context.output.brief_path }}
            - Changed files: ${{ steps.collect_context.output.changed_files_path }}
            - Diff stat: ${{ steps.collect_context.output.diff_stat_path }}
            - Patch: ${{ steps.collect_context.output.patch_path }}
            - Depth: ${{ input.review_depth }}

            Compare implementation against `specs/`, package APIs, CLI commands,
            supervisor endpoints, and run output expectations. Treat this as a
            greenfield breaking change: do not request legacy compatibility.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.api_contract }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 45m

        - id: dataflow_state
          run: agent
          use: reviewer
          prompt: |
            You are the dataflow, state, and concurrency reviewer. Focus on
            fanout, parallel, switch, loop, subworkflow, retry, cancellation,
            paused states, repeated node IDs, and final output projection.

            Refactor goal:
            ${{ input.refactor_goal }}

            Review packet:
            - Repository: `${{ steps.collect_context.output.target_path }}`
            - Brief: ${{ steps.collect_context.output.brief_path }}
            - Changed files: ${{ steps.collect_context.output.changed_files_path }}
            - Patch: ${{ steps.collect_context.output.patch_path }}
            - Depth: ${{ input.review_depth }}

            Look for lost values, collisions, wrong envelope nesting, wrong
            snapshot shape, non-determinism, and failed-run edge cases.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.dataflow_state }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 45m

        - id: docs_truth
          run: agent
          use: reviewer
          prompt: |
            You are the documentation truth reviewer. Focus on README, CONTEXT,
            AGENTS, docs, skill references, and any prose that tells users how
            the system behaves.

            Refactor goal:
            ${{ input.refactor_goal }}

            Review packet:
            - Repository: `${{ steps.collect_context.output.target_path }}`
            - Brief: ${{ steps.collect_context.output.brief_path }}
            - Categories: ${{ steps.collect_context.output.categories_path }}
            - Patch: ${{ steps.collect_context.output.patch_path }}
            - Depth: ${{ input.review_depth }}

            Find stale examples, inaccurate claims, missing public contract
            updates, contradictions with specs, and wording that describes
            removed behavior. Current design truth must live in `specs/`.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.docs_truth }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 45m

        - id: spec_rfc2119
          run: agent
          use: reviewer
          prompt: |
            You are the specification reviewer. Focus only on `specs/` as the
            current design truth and on the template/RFC 2119 requirements.

            Refactor goal:
            ${{ input.refactor_goal }}

            Review packet:
            - Repository: `${{ steps.collect_context.output.target_path }}`
            - Brief: ${{ steps.collect_context.output.brief_path }}
            - Changed files: ${{ steps.collect_context.output.changed_files_path }}
            - Patch: ${{ steps.collect_context.output.patch_path }}
            - Depth: ${{ input.review_depth }}

            Check whether specs fully describe the new current behavior and
            avoid compatibility, migration, or removed-behavior wording unless
            explicitly requested. Cite the exact spec section to change.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.spec_rfc2119 }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 45m

        - id: examples_workflows
          run: agent
          use: reviewer
          prompt: |
            You are the examples and workflow authoring reviewer. Focus on
            `.acpus/workflows`, sample specs, fixtures, README snippets, and any
            user-copyable workflow YAML.

            Refactor goal:
            ${{ input.refactor_goal }}

            Review packet:
            - Repository: `${{ steps.collect_context.output.target_path }}`
            - Brief: ${{ steps.collect_context.output.brief_path }}
            - Categories: ${{ steps.collect_context.output.categories_path }}
            - Patch: ${{ steps.collect_context.output.patch_path }}
            - Depth: ${{ input.review_depth }}

            Validate expressions, output paths, agent output schemas, examples
            that should compile, and examples that teach the public contract.
            Flag snippets that still use removed behavior.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.examples_workflows }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 45m

        - id: test_correctness
          run: agent
          use: reviewer
          prompt: |
            You are the test correctness reviewer. Focus on whether changed or
            added tests assert the intended behavior and fail for the right
            reason.

            Refactor goal:
            ${{ input.refactor_goal }}

            Review packet:
            - Repository: `${{ steps.collect_context.output.target_path }}`
            - Brief: ${{ steps.collect_context.output.brief_path }}
            - Changed files: ${{ steps.collect_context.output.changed_files_path }}
            - Patch: ${{ steps.collect_context.output.patch_path }}
            - Depth: ${{ input.review_depth }}

            Find weak assertions, fixture drift, false positives, tests that
            merely mirror implementation, missing negative checks, and brittle
            snapshots. Recommend the smallest correction per issue.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.test_correctness }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 45m

        - id: test_coverage_gaps
          run: agent
          use: reviewer
          prompt: |
            You are the test coverage gap reviewer. Focus on untested behavior
            implied by the refactor, especially cross-package and end-to-end
            behavior.

            Refactor goal:
            ${{ input.refactor_goal }}

            Review packet:
            - Repository: `${{ steps.collect_context.output.target_path }}`
            - Brief: ${{ steps.collect_context.output.brief_path }}
            - Categories: ${{ steps.collect_context.output.categories_path }}
            - Patch: ${{ steps.collect_context.output.patch_path }}
            - Depth: ${{ input.review_depth }}

            Propose concrete missing tests by package and scenario. Prioritize
            tests that would catch high-impact regressions in real workflows.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.test_coverage_gaps }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 45m

        - id: build_packaging
          run: agent
          use: reviewer
          prompt: |
            You are the build and packaging reviewer. Focus on exports, build
            outputs, package boundaries, scripts, generated artifacts, and
            commands required by repository maintenance rules.

            Refactor goal:
            ${{ input.refactor_goal }}

            Review packet:
            - Repository: `${{ steps.collect_context.output.target_path }}`
            - Brief: ${{ steps.collect_context.output.brief_path }}
            - Changed files: ${{ steps.collect_context.output.changed_files_path }}
            - Diff stat: ${{ steps.collect_context.output.diff_stat_path }}
            - Patch: ${{ steps.collect_context.output.patch_path }}
            - Depth: ${{ input.review_depth }}

            Check whether package exports, TypeScript builds, CLI dist, test
            fixtures, and build artifacts line up with the refactor.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.build_packaging }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 45m

        - id: observability_dx
          run: agent
          use: reviewer
          prompt: |
            You are the observability and developer-experience reviewer. Focus
            on whether users can understand the refactor through CLI output,
            TUI rendering, run inspection APIs, diagnostics, and error messages.

            Refactor goal:
            ${{ input.refactor_goal }}

            Review packet:
            - Repository: `${{ steps.collect_context.output.target_path }}`
            - Brief: ${{ steps.collect_context.output.brief_path }}
            - Changed files: ${{ steps.collect_context.output.changed_files_path }}
            - Patch: ${{ steps.collect_context.output.patch_path }}
            - Depth: ${{ input.review_depth }}

            Find confusing output surfaces, missing diagnostics, inaccurate
            visualizations, and places where debugging large workflows becomes
            harder after the refactor.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.observability_dx }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 45m

    - id: synthesize_review
      run: agent
      use: synthesizer
      prompt: |
        You are the final cross-examination reviewer for a large Acpus refactor.
        Read every parallel report, discard weak claims, merge duplicates, and
        produce a release-readiness verdict.

        Refactor goal:
        ${{ input.refactor_goal }}

        Context:
        - Repository: `${{ steps.collect_context.output.target_path }}`
        - Brief: ${{ steps.collect_context.output.brief_path }}
        - Changed files: ${{ steps.collect_context.output.changed_files_path }}
        - Name status: ${{ steps.collect_context.output.name_status_path }}
        - Diff stat: ${{ steps.collect_context.output.diff_stat_path }}
        - Patch: ${{ steps.collect_context.output.patch_path }}

        Parallel reports:
        - Runtime implementation: ${{ steps.refactor_reviews.output.runtime_implementation.output.report_path }}
        - API contract: ${{ steps.refactor_reviews.output.api_contract.output.report_path }}
        - Dataflow and state: ${{ steps.refactor_reviews.output.dataflow_state.output.report_path }}
        - Documentation truth: ${{ steps.refactor_reviews.output.docs_truth.output.report_path }}
        - Spec RFC 2119: ${{ steps.refactor_reviews.output.spec_rfc2119.output.report_path }}
        - Examples and workflows: ${{ steps.refactor_reviews.output.examples_workflows.output.report_path }}
        - Test correctness: ${{ steps.refactor_reviews.output.test_correctness.output.report_path }}
        - Test coverage gaps: ${{ steps.refactor_reviews.output.test_coverage_gaps.output.report_path }}
        - Build and packaging: ${{ steps.refactor_reviews.output.build_packaging.output.report_path }}
        - Observability and DX: ${{ steps.refactor_reviews.output.observability_dx.output.report_path }}

        Start with exactly one verdict: `ship`, `ship_with_fixes`, or `block`.
        Include sections for blocking, high, medium, needs-verification,
        contradictions, duplicate findings, smallest useful fix order, and
        exact verification commands. Cite concrete file paths and line numbers
        where possible.

        Write the final Markdown report to:
        ${{ steps.collect_context.output.reports.final }}

        Write boundary:
        - Do not create, modify, or delete files in the target repository.
        - Only write to the final report path above, its parent output directory, or a system temporary directory.

        Return JSON with verdict, final report path, and finding counts. Put
        detailed findings in the Markdown report, not in JSON output.
      output:
        verdict: string
        final_report_path: string
        blocking_count: integer
        high_count: integer
        medium_count: integer
        needs_verification_count: integer
      timeout: 60m

outputs:
  verdict: ${{ steps.synthesize_review.output.verdict }}
  final_report_path: ${{ steps.synthesize_review.output.final_report_path }}
  output_dir: ${{ steps.collect_context.output.output_dir }}
  review_brief_path: ${{ steps.collect_context.output.brief_path }}
  changed_file_count: ${{ steps.collect_context.output.changed_file_count }}
  category_code_count: ${{ steps.collect_context.output.category_counts.code }}
  category_runtime_core_count: ${{ steps.collect_context.output.category_counts.runtime_core }}
  category_api_cli_supervisor_count: ${{ steps.collect_context.output.category_counts.api_cli_supervisor }}
  category_spec_docs_count: ${{ steps.collect_context.output.category_counts.spec_docs }}
  category_examples_workflows_count: ${{ steps.collect_context.output.category_counts.examples_workflows }}
  category_tests_count: ${{ steps.collect_context.output.category_counts.tests }}
  category_build_packaging_count: ${{ steps.collect_context.output.category_counts.build_packaging }}
