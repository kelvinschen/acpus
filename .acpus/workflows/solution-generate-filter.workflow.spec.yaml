version: 1
name: solution-generate-filter
description: |
  Dynamic workflow pattern: generate-and-filter.

  Generates multiple solution directions for an Acpus maintainer problem, has
  independent agents filter and critique them, then synthesizes a ranked
  recommendation. Program Steps only prepare deterministic output paths.

  Output: .acpus/output/solution-generate-filter/<run_id>/

input:
  problem: string
  target_path?: string = "."
  constraints?: string = "(none)"
  output_root?: string = ".acpus/output/solution-generate-filter"

agents:
  generator:
    use: pi
  filter:
    use: pi
  synthesizer:
    use: pi

workflow:
  steps:
    - id: prepare_output
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib

          out = pathlib.Path("${{ input.output_root }}").resolve() / "${{ run_id }}"
          out.mkdir(parents=True, exist_ok=True)
          print(json.dumps({
              "output_dir": str(out),
              "final_path": str(out / "recommendation.md"),
          }))
          PY
      capture:
        from: stdout
        parse: json
      output:
        output_dir: string
        final_path: string

    - id: generate_options
      fanout:
        over: ["minimal", "balanced", "bold"]
        key: "${{ item }}"
        max_concurrency: 3
        join: all
        do:
          - id: propose
            run: agent
            use: generator
            prompt: |
              Generate one solution option for this Acpus maintainer problem.
              Your lane is `${{ item }}`. Keep identifiers, file paths, and
              commands verbatim.

              Problem:
              ${{ input.problem }}

              Target repository:
              ${{ input.target_path }}

              Constraints:
              ${{ input.constraints }}

              Focus:
              - `minimal`: smallest useful change.
              - `balanced`: pragmatic high-confidence change.
              - `bold`: larger simplification or redesign.

              Write the option detail to:
              ${{ steps.prepare_output.output.output_dir }}/${{ item }}-option.md

              Return JSON with only lane, title, and report path.
            output:
              lane: string
              title: string
              report_path: string
            timeout: 20m

    - id: filter_options
      parallel:
        - id: feasibility
          run: agent
          use: filter
          prompt: |
            Filter these generated options for feasibility in the current Acpus
            codebase. Prefer evidence over taste.

            Problem:
            ${{ input.problem }}

            Generated options:
            - minimal: title=${{ steps.generate_options[0].output.title }}, report=${{ steps.generate_options[0].output.report_path }}
            - balanced: title=${{ steps.generate_options[1].output.title }}, report=${{ steps.generate_options[1].output.report_path }}
            - bold: title=${{ steps.generate_options[2].output.title }}, report=${{ steps.generate_options[2].output.report_path }}

            Read each option report before evaluating.

            Write the full feasibility filter report to:
            ${{ steps.prepare_output.output.output_dir }}/feasibility-filter.md

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the filter report path above, the workflow output directory, or a system temporary directory.

            Return JSON with report path and compact counts. Put option-level
            reasoning in the Markdown report.
          output:
            report_path: string
            kept_count: integer
            rejected_count: integer
          timeout: 20m

        - id: risk
          run: agent
          use: filter
          prompt: |
            Filter these generated options for correctness, test, and
            maintenance risk.

            Problem:
            ${{ input.problem }}

            Generated options:
            - minimal: title=${{ steps.generate_options[0].output.title }}, report=${{ steps.generate_options[0].output.report_path }}
            - balanced: title=${{ steps.generate_options[1].output.title }}, report=${{ steps.generate_options[1].output.report_path }}
            - bold: title=${{ steps.generate_options[2].output.title }}, report=${{ steps.generate_options[2].output.report_path }}

            Read each option report before evaluating.

            Write the full risk filter report to:
            ${{ steps.prepare_output.output.output_dir }}/risk-filter.md

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the filter report path above, the workflow output directory, or a system temporary directory.

            Return JSON with report path and compact counts. Put option-level
            reasoning in the Markdown report.
          output:
            report_path: string
            disqualified_count: integer
            mitigation_count: integer
          timeout: 20m

    - id: synthesize_recommendation
      run: agent
      use: synthesizer
      prompt: |
        Synthesize the generated options and filters into one ranked
        recommendation for Acpus maintainers. Keep identifiers, file paths, and
        commands verbatim.

        Problem:
        ${{ input.problem }}

        Generated options:
        - minimal: title=${{ steps.generate_options[0].output.title }}, report=${{ steps.generate_options[0].output.report_path }}
        - balanced: title=${{ steps.generate_options[1].output.title }}, report=${{ steps.generate_options[1].output.report_path }}
        - bold: title=${{ steps.generate_options[2].output.title }}, report=${{ steps.generate_options[2].output.report_path }}

        Read each option report before synthesizing.

        Feasibility filter report:
        ${{ steps.filter_options.feasibility.output.report_path }}

        Risk filter report:
        ${{ steps.filter_options.risk.output.report_path }}

        Write the final Markdown report to:
        ${{ steps.prepare_output.output.final_path }}

        Write boundary:
        - Do not create, modify, or delete files in the target repository.
        - Only write to the final report path above, its parent output directory, or a system temporary directory.

        Return JSON with the chosen option, final report path, and confidence.
        Put the implementation outline in the Markdown report.
      output:
        chosen_title: string
        final_report_path: string
        confidence: string
      timeout: 25m

outputs:
  chosen_title: ${{ steps.synthesize_recommendation.output.chosen_title }}
  final_report_path: ${{ steps.synthesize_recommendation.output.final_report_path }}
  output_dir: ${{ steps.prepare_output.output.output_dir }}
