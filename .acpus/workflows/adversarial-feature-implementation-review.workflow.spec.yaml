version: 1
name: adversarial-feature-implementation-review
description: |
  Dynamic workflow pattern: adversarial verification.

  Reviews one feature implementation through independent adversarial lenses,
  then cross-examines the reports into a final verdict. Program Steps only
  collect deterministic git context and output paths; agents perform the
  contract, correctness, test, maintainability, and synthesis work.

  Output: .acpus/output/adversarial-feature-implementation-review/<run_id>/

input:
  target_path: string
  feature_goal: string
  base_ref?: string = "HEAD~1"
  implementation_ref?: string = "HEAD"
  review_depth?: string = "deep"
  review_instructions?: string = "(none)"
  output_root?: string = ".acpus/output/adversarial-feature-implementation-review"

agents:
  reviewer:
    use: traex
  cross_examiner:
    use: pi

workflow:
  steps:
    - id: collect_context
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          target="${{ input.target_path }}"
          root="${{ input.output_root }}"
          run_id="${{ run_id }}"
          python3 - "$target" "$root" "$run_id" "${{ input.base_ref }}" "${{ input.implementation_ref }}" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          target, root, run_id, base_ref, head_ref = sys.argv[1:6]
          target_path = pathlib.Path(target).resolve()
          out = pathlib.Path(root).resolve() / run_id
          out.mkdir(parents=True, exist_ok=True)

          def git(*args):
              return subprocess.run(
                  ["git", "-C", str(target_path), *args],
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              ).stdout

          base_sha = git("rev-parse", "--verify", f"{base_ref}^{{commit}}").strip()
          head_sha = git("rev-parse", "--verify", f"{head_ref}^{{commit}}").strip()
          changed = git("diff", "--name-only", base_sha, head_sha)
          diff_stat = git("diff", "--stat", base_sha, head_sha)
          patch = git("diff", base_sha, head_sha)

          changed_path = out / "changed-files.txt"
          stat_path = out / "diff-stat.txt"
          patch_path = out / "implementation.diff"
          changed_path.write_text(changed, encoding="utf-8")
          stat_path.write_text(diff_stat, encoding="utf-8")
          patch_path.write_text(patch, encoding="utf-8")

          changed_files = [line for line in changed.splitlines() if line.strip()]
          reports = {
              "contract": str(out / "contract.md"),
              "correctness": str(out / "correctness.md"),
              "tests": str(out / "tests.md"),
              "maintainability": str(out / "maintainability.md"),
              "final": str(out / "cross-examination.md"),
          }
          print(json.dumps({
              "output_dir": str(out),
              "target_path": str(target_path),
              "base_sha": base_sha,
              "head_sha": head_sha,
              "changed_files_path": str(changed_path),
              "diff_stat_path": str(stat_path),
              "patch_path": str(patch_path),
              "changed_file_count": len(changed_files),
              "reports": reports,
          }))
          PY
      capture:
        from: stdout
        parse: json
      output:
        output_dir: string
        target_path: string
        base_sha: string
        head_sha: string
        changed_files_path: string
        diff_stat_path: string
        patch_path: string
        changed_file_count: integer
        reports:
          contract: string
          correctness: string
          tests: string
          maintainability: string
          final: string
      timeout: 5m

    - id: require_changed_files
      guard:
        when: steps.collect_context.output.changed_file_count > 0
        then: continue
        else: fail
        message: "No changed files found for ${{ input.base_ref }}..${{ input.implementation_ref }}."

    - id: adversarial_reviews
      parallel:
        - id: contract
          run: agent
          use: reviewer
          prompt: |
            You are a feature contract reviewer. Your goal is to find deviations
            from requirements, public interfaces, and current specs. Keep identifiers, paths, and commands verbatim.

            Feature goal:
            ${{ input.feature_goal }}

            Repository: `${{ steps.collect_context.output.target_path }}`
            Changed files: ${{ steps.collect_context.output.changed_files_path }}
            Diff stat: ${{ steps.collect_context.output.diff_stat_path }}
            Patch: ${{ steps.collect_context.output.patch_path }}
            Depth: ${{ input.review_depth }}

            Compare the implementation with `specs/`, `CONTEXT.md`, tests, and
            user-facing APIs. Cite files and lines. Classify uncertain claims as
            `needs_verification`.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.contract }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 30m

        - id: correctness
          run: agent
          use: reviewer
          prompt: |
            You are a correctness and edge-case reviewer. Treat the patch as a
            system under malformed input, weird timing, cancellation, retry,
            crash recovery, and partial failure. Keep
            identifiers, paths, and commands verbatim.

            Feature goal:
            ${{ input.feature_goal }}

            Repository: `${{ steps.collect_context.output.target_path }}`
            Changed files: ${{ steps.collect_context.output.changed_files_path }}
            Patch: ${{ steps.collect_context.output.patch_path }}
            Depth: ${{ input.review_depth }}

            Provide concrete reproduction ideas or tests for each finding.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.correctness }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 30m

        - id: tests
          run: agent
          use: reviewer
          prompt: |
            You are a test and verification reviewer. Find whether the tests
            cover real behavioral risk, not whether they merely exist. Keep identifiers, paths, and commands verbatim.

            Feature goal:
            ${{ input.feature_goal }}

            Repository: `${{ steps.collect_context.output.target_path }}`
            Changed files: ${{ steps.collect_context.output.changed_files_path }}
            Patch: ${{ steps.collect_context.output.patch_path }}
            Depth: ${{ input.review_depth }}

            Look for missing regression, integration, runtime, CLI, and failure
            cases. For each gap, give the smallest useful test.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.tests }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 30m

        - id: maintainability
          run: agent
          use: reviewer
          prompt: |
            You are a maintainability and architecture reviewer. Find misplaced
            complexity and changes that make future Acpus work brittle. Keep identifiers, paths, and commands verbatim.

            The codebase is under active iteration. Treat feature changes as
            greenfield current behavior; do not recommend compatibility shims,
            migration warnings, or legacy diagnostics unless explicitly asked.

            Feature goal:
            ${{ input.feature_goal }}

            Repository: `${{ steps.collect_context.output.target_path }}`
            Changed files: ${{ steps.collect_context.output.changed_files_path }}
            Patch: ${{ steps.collect_context.output.patch_path }}
            Depth: ${{ input.review_depth }}

            Inspect ownership boundaries, naming, abstraction level,
            duplication, dependency direction, and spec drift.

            Custom instructions:
            ${{ input.review_instructions }}

            Write the complete Markdown report to:
            ${{ steps.collect_context.output.reports.maintainability }}

            Write boundary:
            - Do not create, modify, or delete files in the target repository.
            - Only write to the report path above, its parent output directory, or a system temporary directory.

            Return JSON with the report path and finding counts. Put finding
            details in the Markdown report, not in JSON output.
          output:
            report_path: string
            blocking_count: integer
            high_count: integer
            medium_count: integer
            needs_verification_count: integer
          timeout: 30m

    - id: cross_examine
      run: agent
      use: cross_examiner
      prompt: |
        You are the final cross-examination reviewer. Read all four reports,
        filter weak evidence, merge duplicates, resolve contradictions, and
        produce the final verdict. Keep identifiers, paths,
        and commands verbatim.

        Feature goal:
        ${{ input.feature_goal }}

        Context:
        - Changed files: ${{ steps.collect_context.output.changed_files_path }}
        - Diff stat: ${{ steps.collect_context.output.diff_stat_path }}
        - Patch: ${{ steps.collect_context.output.patch_path }}

        Reports:
        - Contract: ${{ steps.adversarial_reviews.output.contract.output.report_path }}
        - Correctness: ${{ steps.adversarial_reviews.output.correctness.output.report_path }}
        - Tests: ${{ steps.adversarial_reviews.output.tests.output.report_path }}
        - Maintainability: ${{ steps.adversarial_reviews.output.maintainability.output.report_path }}

        Start with one verdict: `ship`, `ship_with_fixes`, or `block`.
        Include blocking, high, medium, and needs-verification sections, concrete
        evidence, fix guidance, suggested tests, contradictions, and the smallest
        useful one-day fix order.

        Write the final Markdown report to:
        ${{ steps.collect_context.output.reports.final }}

        Write boundary:
        - Do not create, modify, or delete files in the target repository.
        - Only write to the final report path above, its parent output directory, or a system temporary directory.

        Return JSON with verdict, final report path, and release-blocking
        counts. Put detailed counts, next actions, and findings in the
        Markdown report.
      output:
        verdict: string
        final_report_path: string
        blocking_count: integer
        high_count: integer
      timeout: 30m

outputs:
  verdict: ${{ steps.cross_examine.output.verdict }}
  final_report_path: ${{ steps.cross_examine.output.final_report_path }}
  output_dir: ${{ steps.collect_context.output.output_dir }}
  blocking_count: ${{ steps.cross_examine.output.blocking_count }}
  high_count: ${{ steps.cross_examine.output.high_count }}
