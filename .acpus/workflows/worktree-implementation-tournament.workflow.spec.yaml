version: 1
name: worktree-implementation-tournament
description: |
  Dynamic workflow pattern: tournament.

  Creates isolated git worktrees, lets multiple agents implement competing
  candidate solutions, verifies each candidate with deterministic commands, asks
  a judge agent to choose the winner, and auto-applies the winning patch to a
  clean main workspace. Program Steps only handle git, patch, and verification
  mechanics; agents handle implementation and judgment.

  Output: .acpus/output/worktree-implementation-tournament/<run_id>/

input:
  target_path: string
  feature_goal: string
  base_ref?: string = "HEAD"
  verification_cmd?: string = "pnpm build && pnpm test"
  output_root?: string = ".acpus/output/worktree-implementation-tournament"
  implementation_notes?: string = "(none)"

agents:
  implementer:
    use: pi
  judge:
    use: pi

workflow:
  steps:
    - id: setup_tournament
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 - "${{ input.target_path }}" "${{ input.output_root }}" "${{ run_id }}" "${{ input.base_ref }}" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          target, root, run_id, base_ref = sys.argv[1:5]
          repo = pathlib.Path(target).resolve()
          out = pathlib.Path(root).resolve() / run_id
          worktrees_root = out / "worktrees"
          patches_root = out / "patches"
          logs_root = out / "logs"
          for path in (worktrees_root, patches_root, logs_root):
              path.mkdir(parents=True, exist_ok=True)

          status = subprocess.run(["git", "-C", str(repo), "status", "--porcelain"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          base = subprocess.run(["git", "-C", str(repo), "rev-parse", "--verify", f"{base_ref}^{{commit}}"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          ok = status.returncode == 0 and base.returncode == 0 and status.stdout.strip() == ""
          candidates = []
          if ok:
              for lane in ("candidate-a", "candidate-b", "candidate-c"):
                  path = worktrees_root / lane
                  subprocess.run(["git", "-C", str(repo), "worktree", "remove", "--force", str(path)], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  create = subprocess.run(["git", "-C", str(repo), "worktree", "add", "--detach", str(path), base.stdout.strip()], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  candidates.append({
                      "id": lane,
                      "worktree_path": str(path),
                      "patch_path": str(patches_root / f"{lane}.patch"),
                      "verify_log_path": str(logs_root / f"{lane}-verify.log"),
                      "created": create.returncode == 0,
                  })
                  if create.returncode != 0:
                      ok = False
          print(json.dumps({
              "ok": ok,
              "output_dir": str(out),
              "repo_path": str(repo),
              "base_sha": base.stdout.strip() if base.returncode == 0 else "",
              "dirty_status": status.stdout,
              "candidates": candidates,
              "winner_patch_path": str(patches_root / "winner.patch"),
              "apply_log_path": str(logs_root / "apply-winner.log"),
              "final_verify_log_path": str(logs_root / "final-verify.log"),
          }))
          PY
      capture:
        from: stdout
        parse: json
      output:
        ok: boolean
        output_dir: string
        repo_path: string
        base_sha: string
        dirty_status: string
        candidates:
          - id: string
            worktree_path: string
            patch_path: string
            verify_log_path: string
            created: boolean
        winner_patch_path: string
        apply_log_path: string
        final_verify_log_path: string
      timeout: 10m

    - id: require_clean_workspace
      guard:
        when: steps.setup_tournament.output.ok
        then: continue
        else: fail
        message: "Target workspace must be clean and worktrees must be created before tournament implementation."

    - id: implement_candidates
      fanout:
        over: steps.setup_tournament.output.candidates
        key: "${{ item.id }}"
        max_concurrency: 3
        join: all
        do:
          - id: implement
            run: agent
            use: implementer
            cwd: "${{ item.worktree_path }}"
            prompt: |
              Implement this feature in the isolated git worktree. You are
              already running inside the candidate worktree (your working
              directory is the worktree root). Keep identifiers, paths, and
              commands verbatim.

              Feature goal:
              ${{ input.feature_goal }}

              Candidate id:
              ${{ item.id }}

              Worktree:
              ${{ item.worktree_path }}

              Base SHA:
              ${{ steps.setup_tournament.output.base_sha }}

              Implementation notes:
              ${{ input.implementation_notes }}

              Requirements:
              - Modify only the candidate worktree.
              - Do not commit.
              - Favor a distinct implementation strategy for this candidate.
              - Keep complex code decisions in this agent step.

              Write a short implementation report to:
              ${{ steps.setup_tournament.output.output_dir }}/${{ item.id }}-implementation.md

              Return JSON with only candidate id and report path.
            output:
              candidate_id: string
              report_path: string
            timeout: 45m

          - id: capture_candidate_patch
            run: program
            cmd:
              - bash
              - -c
              - |
                set -euo pipefail
                worktree="${{ item.worktree_path }}"
                patch="${{ item.patch_path }}"
                log="${{ item.verify_log_path }}"
                verify="${{ input.verification_cmd }}"
                python3 - "$worktree" "$patch" "$log" "$verify" <<'PY'
                import json
                import pathlib
                import subprocess
                import sys

                worktree, patch, log, verify = sys.argv[1:5]
                wt = pathlib.Path(worktree)
                patch_path = pathlib.Path(patch)
                log_path = pathlib.Path(log)
                # Stage everything (including untracked new files) so the diff
                # captures the full candidate change; `git diff` alone omits
                # untracked files.
                add = subprocess.run(["git", "-C", str(wt), "add", "-A"], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                diff = subprocess.run(["git", "-C", str(wt), "diff", "--cached", "--binary"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                patch_path.write_text(diff.stdout, encoding="utf-8")
                verify_result = subprocess.run(["bash", "-c", verify], cwd=wt, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                log_path.write_text(verify_result.stdout, encoding="utf-8")
                print(json.dumps({
                    "ok": add.returncode == 0 and diff.returncode == 0 and verify_result.returncode == 0 and patch_path.stat().st_size > 0,
                    "patch_path": str(patch_path),
                    "verify_log_path": str(log_path),
                    "verify_exit_code": verify_result.returncode,
                }))
                PY
            capture:
              from: stdout
              parse: json
            output:
              ok: boolean
              patch_path: string
              verify_log_path: string
              verify_exit_code: integer
            timeout: 30m

    - id: judge_winner
      run: agent
      use: judge
      prompt: |
        Judge this implementation tournament. Keep identifiers, file paths, and
        commands verbatim.

        Feature goal:
        ${{ input.feature_goal }}

        Candidate verification and artifacts:
        - candidate-a:
          - implementation report: ${{ steps.setup_tournament.output.output_dir }}/candidate-a-implementation.md
          - patch: ${{ steps.implement_candidates.output[0].output.patch_path }}
          - verify log: ${{ steps.implement_candidates.output[0].output.verify_log_path }}
          - verify_exit_code: ${{ steps.implement_candidates.output[0].output.verify_exit_code }}
          - ok: ${{ steps.implement_candidates.output[0].output.ok }}
        - candidate-b:
          - implementation report: ${{ steps.setup_tournament.output.output_dir }}/candidate-b-implementation.md
          - patch: ${{ steps.implement_candidates.output[1].output.patch_path }}
          - verify log: ${{ steps.implement_candidates.output[1].output.verify_log_path }}
          - verify_exit_code: ${{ steps.implement_candidates.output[1].output.verify_exit_code }}
          - ok: ${{ steps.implement_candidates.output[1].output.ok }}
        - candidate-c:
          - implementation report: ${{ steps.setup_tournament.output.output_dir }}/candidate-c-implementation.md
          - patch: ${{ steps.implement_candidates.output[2].output.patch_path }}
          - verify log: ${{ steps.implement_candidates.output[2].output.verify_log_path }}
          - verify_exit_code: ${{ steps.implement_candidates.output[2].output.verify_exit_code }}
          - ok: ${{ steps.implement_candidates.output[2].output.ok }}

        Read each implementation report, patch, and verify log before judging.

        Choose exactly one winner from candidates whose deterministic verification
        passed. Consider correctness, test coverage, maintainability, size of
        change, and fit with Acpus specs. If no candidate is acceptable, return
        `acceptable: false`.

        Write a Markdown judging report to:
        ${{ steps.setup_tournament.output.output_dir }}/judging-report.md

        Write boundary:
        - Do not create, modify, or delete files in the target repository or candidate worktrees.
        - Only write to the judging report path above, the workflow output directory, or a system temporary directory.

        Return JSON with the winning candidate id, patch path, and judging
        report path. Put rationale in the Markdown judging report.
      output:
        acceptable: boolean
        winner_id: string
        winner_patch_path: string
        report_path: string
      timeout: 25m

    - id: apply_winner
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          repo="${{ steps.setup_tournament.output.repo_path }}"
          patch="${{ steps.judge_winner.output.winner_patch_path }}"
          apply_log="${{ steps.setup_tournament.output.apply_log_path }}"
          verify_log="${{ steps.setup_tournament.output.final_verify_log_path }}"
          verify="${{ input.verification_cmd }}"
          python3 - "$repo" "$patch" "$apply_log" "$verify_log" "$verify" "${{ steps.judge_winner.output.acceptable }}" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          repo, patch, apply_log, verify_log, verify, acceptable = sys.argv[1:7]
          repo_path = pathlib.Path(repo)
          patch_path = pathlib.Path(patch)
          apply_log_path = pathlib.Path(apply_log)
          verify_log_path = pathlib.Path(verify_log)
          result = {
              "ok": False,
              "applied": False,
              "verified": False,
              "rolled_back": False,
              "verify_exit_code": -1,
              "apply_log_path": str(apply_log_path),
              "final_verify_log_path": str(verify_log_path),
          }
          status = subprocess.run(["git", "-C", str(repo_path), "status", "--porcelain"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          if acceptable != "true":
              apply_log_path.write_text("judge did not accept any candidate\n", encoding="utf-8")
          elif status.stdout.strip():
              apply_log_path.write_text("workspace is dirty; refusing to apply winner\n" + status.stdout, encoding="utf-8")
          elif not patch_path.is_file() or patch_path.stat().st_size == 0:
              apply_log_path.write_text(f"winner patch missing or empty: {patch_path}\n", encoding="utf-8")
          else:
              apply = subprocess.run(["git", "-C", str(repo_path), "apply", "--whitespace=nowarn", str(patch_path)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              apply_log_path.write_text(apply.stdout, encoding="utf-8")
              result["applied"] = apply.returncode == 0
              if result["applied"]:
                  verify_result = subprocess.run(["bash", "-c", verify], cwd=repo_path, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  verify_log_path.write_text(verify_result.stdout, encoding="utf-8")
                  result["verified"] = verify_result.returncode == 0
                  result["verify_exit_code"] = verify_result.returncode
                  result["ok"] = result["verified"]
                  if not result["verified"]:
                      rollback = subprocess.run(["git", "-C", str(repo_path), "apply", "-R", "--whitespace=nowarn", str(patch_path)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                      with apply_log_path.open("a", encoding="utf-8") as log:
                          log.write("\nfinal verification failed; rolling back applied patch\n")
                          log.write(rollback.stdout)
                      result["rolled_back"] = rollback.returncode == 0
          print(json.dumps(result))
          PY
      capture:
        from: stdout
        parse: json
      output:
        ok: boolean
        applied: boolean
        verified: boolean
        rolled_back: boolean
        verify_exit_code: integer
        apply_log_path: string
        final_verify_log_path: string
      timeout: 45m

    - id: require_applied_winner
      guard:
        when: steps.apply_winner.output.ok
        then: continue
        else: fail
        message: "Winner patch was not applied or final verification failed."

outputs:
  winner_id: ${{ steps.judge_winner.output.winner_id }}
  report_path: ${{ steps.judge_winner.output.report_path }}
  output_dir: ${{ steps.setup_tournament.output.output_dir }}
  final_verify_log_path: ${{ steps.apply_winner.output.final_verify_log_path }}
