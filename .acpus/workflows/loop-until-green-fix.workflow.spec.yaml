version: 1
name: loop-until-green-fix
description: |
  Dynamic workflow pattern: loop-until-done.

  Creates one isolated git worktree, repeatedly lets an agent repair a failing
  target, runs deterministic verification after each attempt, and auto-applies
  the passing patch to a clean main workspace. Program Steps only handle git,
  patch, and verification mechanics; the agent performs each repair attempt.

  Output: .acpus/output/loop-until-green-fix/<run_id>/

input:
  target_path: string
  fix_goal: string
  base_ref?: string = "HEAD"
  verification_cmd?: string = "pnpm build && pnpm test"
  output_root?: string = ".acpus/output/loop-until-green-fix"
  repair_notes?: string = "(none)"

agents:
  fixer:
    use: pi

workflow:
  steps:
    - id: setup_fix_worktree
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 - "${{ input.target_path }}" "${{ input.output_root }}" "${{ run_id }}" "${{ input.base_ref }}" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          target, root, run_id, base_ref = sys.argv[1:5]
          repo = pathlib.Path(target).resolve()
          out = pathlib.Path(root).resolve() / run_id
          worktree = out / "worktree"
          logs = out / "logs"
          patches = out / "patches"
          for path in (logs, patches):
              path.mkdir(parents=True, exist_ok=True)
          status = subprocess.run(["git", "-C", str(repo), "status", "--porcelain"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          base = subprocess.run(["git", "-C", str(repo), "rev-parse", "--verify", f"{base_ref}^{{commit}}"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          ok = status.returncode == 0 and base.returncode == 0 and status.stdout.strip() == ""
          created = False
          if ok:
              subprocess.run(["git", "-C", str(repo), "worktree", "remove", "--force", str(worktree)], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              create = subprocess.run(["git", "-C", str(repo), "worktree", "add", "--detach", str(worktree), base.stdout.strip()], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              created = create.returncode == 0
              ok = ok and created
          print(json.dumps({
              "ok": ok,
              "created": created,
              "repo_path": str(repo),
              "worktree_path": str(worktree),
              "output_dir": str(out),
              "base_sha": base.stdout.strip() if base.returncode == 0 else "",
              "dirty_status": status.stdout,
              "patch_path": str(patches / "passing-fix.patch"),
              "verify_log_path": str(logs / "latest-verify.log"),
              "apply_log_path": str(logs / "apply-fix.log"),
              "final_verify_log_path": str(logs / "final-verify.log"),
          }))
          PY
      capture:
        from: stdout
        parse: json
      output:
        ok: boolean
        created: boolean
        repo_path: string
        worktree_path: string
        output_dir: string
        base_sha: string
        dirty_status: string
        patch_path: string
        verify_log_path: string
        apply_log_path: string
        final_verify_log_path: string
      timeout: 10m

    - id: require_clean_workspace
      guard:
        when: steps.setup_fix_worktree.output.ok
        then: continue
        else: fail
        message: "Target workspace must be clean and fix worktree must be created."

    - id: repair_loop
      loop:
        until: loop.iter > 0 && coalesce(steps.verify_attempt.output.ok, false)
        max_iterations: 3
        do:
          - id: repair_attempt
            run: agent
            use: fixer
            prompt: |
              Repair the failing Acpus target in the isolated worktree. Keep
              identifiers, paths, and commands verbatim.

              Fix goal:
              ${{ input.fix_goal }}

              Worktree:
              ${{ steps.setup_fix_worktree.output.worktree_path }}

              Verification command:
              ${{ input.verification_cmd }}

              Iteration:
              ${{ loop.iter }}

              Previous verification output, if available:
              ${{ loop.iter == 0 ? "(none)" : steps.verify_attempt.output.verify_log_path }}

              Repair notes:
              ${{ input.repair_notes }}

              Requirements:
              - Modify only the isolated worktree.
              - Do not commit.
              - Keep complex diagnosis and repair decisions in this agent step.

              Write a short repair report to:
              ${{ steps.setup_fix_worktree.output.output_dir }}/repair-round-${{ loop.iter }}.md

              Return JSON with only the report path.
            output:
              report_path: string
            timeout: 45m

          - id: verify_attempt
            run: program
            cmd:
              - bash
              - -c
              - |
                set -euo pipefail
                worktree="${{ steps.setup_fix_worktree.output.worktree_path }}"
                verify="${{ input.verification_cmd }}"
                patch="${{ steps.setup_fix_worktree.output.patch_path }}"
                log="${{ steps.setup_fix_worktree.output.verify_log_path }}"
                python3 - "$worktree" "$verify" "$patch" "$log" <<'PY'
                import json
                import pathlib
                import subprocess
                import sys

                worktree, verify, patch, log = sys.argv[1:5]
                wt = pathlib.Path(worktree)
                patch_path = pathlib.Path(patch)
                log_path = pathlib.Path(log)
                verify_result = subprocess.run(["bash", "-c", verify], cwd=wt, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                log_path.write_text(verify_result.stdout, encoding="utf-8")
                diff = subprocess.run(["git", "-C", str(wt), "diff", "--binary"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                patch_path.write_text(diff.stdout, encoding="utf-8")
                print(json.dumps({
                    "ok": diff.returncode == 0 and verify_result.returncode == 0 and patch_path.stat().st_size > 0,
                    "verify_exit_code": verify_result.returncode,
                    "verify_log_path": str(log_path),
                    "patch_path": str(patch_path),
                }))
                PY
            capture:
              from: stdout
              parse: json
            output:
              ok: boolean
              verify_exit_code: integer
              verify_log_path: string
              patch_path: string
            timeout: 45m

    - id: apply_fix
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          repo="${{ steps.setup_fix_worktree.output.repo_path }}"
          patch="${{ steps.setup_fix_worktree.output.patch_path }}"
          apply_log="${{ steps.setup_fix_worktree.output.apply_log_path }}"
          verify_log="${{ steps.setup_fix_worktree.output.final_verify_log_path }}"
          verify="${{ input.verification_cmd }}"
          python3 - "$repo" "$patch" "$apply_log" "$verify_log" "$verify" <<'PY'
          import json
          import pathlib
          import subprocess
          import sys

          repo, patch, apply_log, verify_log, verify = sys.argv[1:6]
          repo_path = pathlib.Path(repo)
          patch_path = pathlib.Path(patch)
          apply_log_path = pathlib.Path(apply_log)
          verify_log_path = pathlib.Path(verify_log)
          result = {
              "ok": False,
              "applied": False,
              "verified": False,
              "rolled_back": False,
              "verify_exit_code": -1,
              "apply_log_path": str(apply_log_path),
              "final_verify_log_path": str(verify_log_path),
          }
          status = subprocess.run(["git", "-C", str(repo_path), "status", "--porcelain"], text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          if status.stdout.strip():
              apply_log_path.write_text("workspace is dirty; refusing to apply fix\n" + status.stdout, encoding="utf-8")
          elif not patch_path.is_file() or patch_path.stat().st_size == 0:
              apply_log_path.write_text(f"patch missing or empty: {patch_path}\n", encoding="utf-8")
          else:
              apply = subprocess.run(["git", "-C", str(repo_path), "apply", "--whitespace=nowarn", str(patch_path)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              apply_log_path.write_text(apply.stdout, encoding="utf-8")
              result["applied"] = apply.returncode == 0
              if result["applied"]:
                  verify_result = subprocess.run(["bash", "-c", verify], cwd=repo_path, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  verify_log_path.write_text(verify_result.stdout, encoding="utf-8")
                  result["verified"] = verify_result.returncode == 0
                  result["verify_exit_code"] = verify_result.returncode
                  result["ok"] = result["verified"]
                  if not result["verified"]:
                      rollback = subprocess.run(["git", "-C", str(repo_path), "apply", "-R", "--whitespace=nowarn", str(patch_path)], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                      with apply_log_path.open("a", encoding="utf-8") as log:
                          log.write("\nfinal verification failed; rolling back applied patch\n")
                          log.write(rollback.stdout)
                      result["rolled_back"] = rollback.returncode == 0
          print(json.dumps(result))
          PY
      capture:
        from: stdout
        parse: json
      output:
        ok: boolean
        applied: boolean
        verified: boolean
        rolled_back: boolean
        verify_exit_code: integer
        apply_log_path: string
        final_verify_log_path: string
      timeout: 45m

    - id: require_fix_applied
      guard:
        when: steps.apply_fix.output.ok
        then: continue
        else: fail
        message: "Passing fix patch was not applied or final verification failed."

outputs:
  output_dir: ${{ steps.setup_fix_worktree.output.output_dir }}
  patch_path: ${{ steps.setup_fix_worktree.output.patch_path }}
  final_verify_log_path: ${{ steps.apply_fix.output.final_verify_log_path }}
