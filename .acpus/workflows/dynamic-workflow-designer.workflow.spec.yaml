version: 1
name: dynamic-workflow-designer
description: |
  Dynamic workflow pattern: classify-and-act.

  Classifies an Acpus maintainer task, routes through a static agent role, and
  has an agent design a new Acpus Workflow Spec. Program Steps only prepare
  paths, check catalog collisions, lint the generated spec, and install it.

  Output: .acpus/output/dynamic-workflow-designer/<run_id>/

input:
  task: string
  target_path?: string = "."
  desired_name?: string = ""
  output_root?: string = ".acpus/output/dynamic-workflow-designer"
  design_constraints?: string = "(none)"

agents:
  fast_designer:
    use: pi
  deep_designer:
    use: pi
  reviewer:
    use: pi

workflow:
  steps:
    - id: prepare_output
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib

          out = pathlib.Path("${{ input.output_root }}").resolve() / "${{ run_id }}"
          out.mkdir(parents=True, exist_ok=True)
          print(json.dumps({
              "output_dir": str(out),
              "candidate_path": str(out / "candidate.workflow.spec.yaml"),
              "review_path": str(out / "workflow-design-review.md"),
              "lint_path": str(out / "lint.json"),
          }))
          PY
      capture:
        from: stdout
        parse: json
      output:
        output_dir: string
        candidate_path: string
        review_path: string
        lint_path: string

    - id: classify
      run: agent
      use: fast_designer
      prompt: |
        Classify this Acpus workflow-design task. Return compact JSON only.

        Task:
        ${{ input.task }}

        Desired workflow name, if any:
        ${{ input.desired_name }}

        Design constraints:
        ${{ input.design_constraints }}

        Decide whether this is simple enough for a compact workflow or requires
        deeper design. Agents should handle ambiguity; Program Steps should only
        do deterministic glue.

        Required vocabulary:
        - `complexity` MUST be one of `simple`, `moderate`, or `complex`.
        - `recommended_pattern` MUST be one of `classify-and-act`,
          `fanout-and-synthesize`, `adversarial-verification`,
          `generate-and-filter`, `tournament`, or `loop-until-done`.
      output:
        complexity: string
        recommended_pattern: string
        needs_deep_design: boolean
      timeout: 10m

    - id: design_route
      switch:
        cases:
          - when: steps.classify.output.needs_deep_design
            do:
              - id: deep_design
                run: agent
                use: deep_designer
                prompt: |
                  Design a runnable Acpus Workflow Spec for this maintainer task.
                  Write the YAML file yourself to:
                  ${{ steps.prepare_output.output.candidate_path }}

                  Task:
                  ${{ input.task }}

                  Target path:
                  ${{ input.target_path }}

                  Desired name:
                  ${{ input.desired_name }}

                  Recommended pattern:
                  ${{ steps.classify.output.recommended_pattern }}

                  Constraints:
                  ${{ input.design_constraints }}

                  Requirements:
                  - Use valid Acpus Workflow Spec YAML.
                  - Keep complex reasoning in Agent Steps.
                  - Use Program Steps only for deterministic commands.
                  - Use static agent roles; do not rely on dynamic model expressions.
                  - Include a clear `description` that states the dynamic workflow pattern.
                  - Write only the candidate workflow file path above or files under its parent output directory or a system temporary directory.
                  - Do not create, modify, or delete files in the target repository.
                  - Put design rationale and risk notes in the candidate file
                    comments or companion review note if needed.
                  - Return JSON with the workflow name and file path.
                output:
                  workflow_name: string
                  candidate_path: string
                timeout: 30m
        default:
          do:
            - id: compact_design
              run: agent
              use: fast_designer
              prompt: |
                Design a compact runnable Acpus Workflow Spec for this maintainer task.
                Write the YAML file yourself to:
                ${{ steps.prepare_output.output.candidate_path }}

                Task:
                ${{ input.task }}

                Target path:
                ${{ input.target_path }}

                Desired name:
                ${{ input.desired_name }}

                Recommended pattern:
                ${{ steps.classify.output.recommended_pattern }}

                Constraints:
                ${{ input.design_constraints }}

                Requirements:
                - Use valid Acpus Workflow Spec YAML.
                - Keep complex reasoning in Agent Steps.
                - Use Program Steps only for deterministic commands.
                - Use static agent roles; do not rely on dynamic model expressions.
                - Include a clear `description` that states the dynamic workflow pattern.
                - Write only the candidate workflow file path above or files under its parent output directory or a system temporary directory.
                - Do not create, modify, or delete files in the target repository.
                - Put design rationale and risk notes in the candidate file
                  comments or companion review note if needed.
                - Return JSON with the workflow name and file path.
              output:
                workflow_name: string
                candidate_path: string
              timeout: 20m

    - id: normalize_design
      run: agent
      use: reviewer
      prompt: |
        Review the generated Acpus Workflow Spec for correctness and installability.
        If needed, edit the file in place. Keep the task-specific complex
        judgment in this agent step; the next Program Step only runs deterministic
        collision checks and lint.

        Candidate file:
        ${{ steps.prepare_output.output.candidate_path }}

        Original task:
        ${{ input.task }}

        Classification:
        complexity=${{ steps.classify.output.complexity }}
        pattern=${{ steps.classify.output.recommended_pattern }}
        needs_deep_design=${{ steps.classify.output.needs_deep_design }}

        Write a Markdown review note to:
        ${{ steps.prepare_output.output.review_path }}

        Write boundary:
        - You may edit only the candidate workflow file and the review note path above.
        - Do not create, modify, or delete files in the target repository.
        - Any scratch files must stay under the prepared output directory or a system temporary directory.

        Return JSON with final workflow name, candidate path, review path, and
        readiness. Put review notes in the Markdown review file.
      output:
        workflow_name: string
        candidate_path: string
        review_path: string
        ready: boolean
      timeout: 20m

    - id: install_generated_workflow
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          target="${{ input.target_path }}"
          candidate="${{ steps.prepare_output.output.candidate_path }}"
          workflow_name="${{ steps.normalize_design.output.workflow_name }}"
          lint_path="${{ steps.prepare_output.output.lint_path }}"
          python3 - "$target" "$candidate" "$workflow_name" "$lint_path" <<'PY'
          import json
          import pathlib
          import re
          import shutil
          import subprocess
          import sys

          target, candidate, workflow_name, lint_path = sys.argv[1:5]
          target_path = pathlib.Path(target).resolve()
          candidate_path = pathlib.Path(candidate).resolve()
          lint_output = pathlib.Path(lint_path).resolve()
          catalog = target_path / ".acpus" / "workflows"
          safe_name = re.sub(r"[^A-Za-z0-9_.-]+", "-", workflow_name).strip("-").lower()
          dest = catalog / f"{safe_name}.workflow.spec.yaml"
          result = {
              "ok": False,
              "workflow_name": workflow_name,
              "candidate_path": str(candidate_path),
              "installed_path": str(dest),
              "lint_path": str(lint_output),
              "diagnostics": [],
          }

          if not safe_name:
              result["diagnostics"].append("workflow name is empty after sanitization")
          if not candidate_path.is_file():
              result["diagnostics"].append("candidate workflow file does not exist")
          if dest.exists():
              result["diagnostics"].append(f"catalog file already exists: {dest}")
          catalog_list = subprocess.run(
              ["pnpm", "--silent", "acpus", "workflows", "list", "--json"],
              cwd=target_path,
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          )
          if catalog_list.returncode == 0:
              try:
                  existing = json.loads(catalog_list.stdout)
                  if any(entry.get("name") == workflow_name for entry in existing):
                      result["diagnostics"].append(f"workflow name already exists in catalog: {workflow_name}")
              except Exception as error:
                  result["diagnostics"].append(f"failed to parse catalog list output: {error}")
          else:
              result["diagnostics"].append("failed to list existing workflow catalog")

          if not result["diagnostics"]:
              lint = subprocess.run(
                  ["pnpm", "--silent", "acpus", "workflows", "lint", str(candidate_path), "--json"],
                  cwd=target_path,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              lint_output.write_text(lint.stdout or lint.stderr, encoding="utf-8")
              result["lint_exit_code"] = lint.returncode
              if lint.returncode != 0:
                  result["diagnostics"].append("candidate workflow lint failed")
              else:
                  catalog.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(candidate_path, dest)
                  result["ok"] = True

          print(json.dumps(result))
          PY
      capture:
        from: stdout
        parse: json
      output:
        ok: boolean
        workflow_name: string
        candidate_path: string
        installed_path: string
        lint_path: string
        lint_exit_code?: integer
        diagnostics:
          - string
      timeout: 5m

    - id: require_installed
      guard:
        when: steps.install_generated_workflow.output.ok
        then: continue
        else: fail
        message: "Generated workflow failed lint or catalog collision checks."

outputs:
  installed_path: ${{ steps.install_generated_workflow.output.installed_path }}
  output_dir: ${{ steps.prepare_output.output.output_dir }}
  classification: ${{ steps.classify.output.recommended_pattern }}
