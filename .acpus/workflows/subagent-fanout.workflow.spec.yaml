version: 1
name: subagent-fanout
description: |
  General purpose subagent-driven workflow — dispatches N parallel subagents
  sharing one agent definition, each with its own task, then aggregates their
  outputs into a combined result.

  This workflow is not tied to any specific project or repository. Pass a list
  of tasks, and each subagent works independently on its own task. The final
  step collects all deliverables into a single combined report.

  Override the worker agent via CLI: --agents '{"worker":{"use":"claude"}}'

input:
  tasks: array
  context?: string = "(none)"
  output_root?: string = ".acpus/output/subagent-fanout"

agents:
  worker:
    use: pi

workflow:
  steps:
    # ── Guard: reject empty task list ──
    - id: require_tasks
      guard:
        when: len(input.tasks) > 0
        then: continue
        else: fail
        message: "input.tasks must be a non-empty array"

    # ── Prepare: ensure output directory ──
    - id: prepare
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          mkdir -p "${{ input.output_root }}/${{ run_id }}"
          echo '{"output_dir": "${{ input.output_root }}/${{ run_id }}"}'
      capture:
        from: stdout
        parse: json
      output:
        output_dir: string
      timeout: 30s

    # ── Fanout: each subagent works on its own task ──
    - id: dispatch
      fanout:
        over: input.tasks
        key: "agent-${{ item_index }}"
        max_concurrency: 10
        join: all
        do:
          - id: work
            run: agent
            use: worker
            prompt: |
              You are subagent #${{ item_index }}.

              ## Context
              ${{ input.context }}

              ## Your Task
              ${{ item }}

              Work independently. Write your deliverable to:
              ${{ steps.prepare.output.output_dir }}/agent-${{ item_index }}.md

              When complete, provide a brief summary of what you produced.
            output:
              summary: string
              report_path: string
            timeout: 20m

    # ── Aggregate: collect all subagent outputs into a combined result ──
    - id: aggregate
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 - "${{ steps.prepare.output.output_dir }}" "${{ len(input.tasks) }}" "${{ len(steps.dispatch.output) }}" <<'PY'
          import json, glob, os, re, sys

          root = sys.argv[1]
          dispatched = int(sys.argv[2])
          succeeded = int(sys.argv[3])

          reports = sorted(
            glob.glob(os.path.join(root, "agent-*.md")),
            key=lambda x: int(re.search(r"agent-(\d+)", os.path.basename(x)).group(1)),
          )
          combined_path = os.path.join(root, "combined.md")

          with open(combined_path, "w") as out:
            out.write("# Subagent Fanout Report\n\n")
            out.write(f"- Dispatched: {dispatched}\n")
            out.write(f"- Succeeded: {succeeded}\n\n")
            for r in reports:
              agent_id = os.path.basename(r).replace(".md", "")
              out.write(f"## {agent_id}\n\n")
              with open(r) as f:
                out.write(f.read())
              out.write("\n\n---\n\n")

          print(json.dumps({
            "dispatched": dispatched,
            "succeeded": succeeded,
            "report_paths": reports,
            "combined_report": combined_path,
          }))
          PY
      capture:
        from: stdout
        parse: json
      output:
        dispatched: integer
        succeeded: integer
        report_paths: array
        combined_report: string
      timeout: 30s

outputs:
  dispatched: ${{ steps.aggregate.output.dispatched }}
  succeeded: ${{ steps.aggregate.output.succeeded }}
  report_paths: ${{ steps.aggregate.output.report_paths }}
  combined_report: ${{ steps.aggregate.output.combined_report }}
