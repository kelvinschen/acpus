    <pattern id="dotsInk" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)"><circle cx="3" cy="3" r="2.1" fill="#252828"/></pattern>
  </defs>
  <rect data-app-icon="shadow" x="20" y="22" width="438" height="438" rx="100" fill="url(#ink)"/>
  <rect data-app-icon="edge" x="12" y="12" width="438" height="438" rx="100" fill="#E7E0D3"/>
  <rect data-app-icon="paper" x="18" y="18" width="426" height="426" rx="92" fill="url(#paper)"/>
  <g transform="translate(235 235) scale(.9) translate(-235 -235)">
    <g data-brand-mark="compass-arch" transform="translate(32 50) scale(0.96) translate(-180 -160)"><path d="M195 14L217 15L226 18L245 31L264 53L295 117L329 209L317 214L303 216L277 213L243 111L230 81L221 70L213 66L203 67L194 72L180 86L149 138L121 196L62 340L50 346L32 341L12 331L11 327L19 305L56 217L118 86L156 30ZM352 267L357 272L375 321L368 332L345 342L325 334L304 278L312 279L326 276Z" transform="translate(180 160)" fill="url(#orangeInk)" fill-rule="evenodd"/><path d="M212 13L244 14L272 24L303 49L316 69L327 98L331 128L328 150L322 170L306 198L276 220L246 230L208 233L138 225L98 231L66 241L40 253L18 247L17 239L30 201L66 186L120 174L156 174L228 182L242 179L254 173L265 163L271 154L278 134L279 114L275 96L265 78L253 67L237 60L213 57L196 21L196 19Z" transform="translate(260 200)" fill="url(#blueInk)" fill-rule="evenodd"/></g>
  </g>
