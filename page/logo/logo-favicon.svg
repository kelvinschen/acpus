      <g fill="#fff" opacity=".48"><circle cx="9" cy="14" r=".7"/><circle cx="27" cy="3" r=".45"/><circle cx="24" cy="25" r=".6"/><circle cx="41" cy="22" r=".5"/></g>
    </pattern>
    <pattern id="blueInk" width="29" height="31" patternUnits="userSpaceOnUse">
