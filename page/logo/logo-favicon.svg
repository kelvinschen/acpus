<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 470" width="64" height="64" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Acpus app icon</title>
  <desc id="desc">Orange compass arch interlaced with an ultramarine relay loop on a rounded paper app icon.</desc>
  <defs>
    <pattern id="paper" width="43" height="37" patternUnits="userSpaceOnUse">
