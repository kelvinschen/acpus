      <g fill="#FBF6EB" opacity=".19"><circle cx="3" cy="8" r=".8"/><circle cx="13" cy="3" r=".55"/><circle cx="24" cy="13" r=".7"/><circle cx="8" cy="24" r=".45"/><circle cx="21" cy="27" r=".65"/></g>
      <g fill="#001B71" opacity=".12"><circle cx="18" cy="17" r=".45"/><circle cx="27" cy="4" r=".35"/><circle cx="2" cy="29" r=".35"/></g>
    </pattern>
    <pattern id="orangeInk" width="31" height="27" patternUnits="userSpaceOnUse">
      <rect width="31" height="27" fill="#FA7408"/>
      <g fill="#FBF6EB" opacity=".2"><circle cx="5" cy="5" r=".7"/><circle cx="17" cy="3" r=".5"/><circle cx="27" cy="10" r=".75"/><circle cx="10" cy="19" r=".45"/><circle cx="24" cy="24" r=".6"/></g>
      <g fill="#B44100" opacity=".1"><circle cx="17" cy="14" r=".45"/><circle cx="2" cy="25" r=".35"/></g>
    </pattern>
    <pattern id="ink" width="37" height="33" patternUnits="userSpaceOnUse">
