<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1672 720" width="1672" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Acpus paper-cut brand hero</title>
  <desc id="desc">A tactile Acpus paper-cut wordmark with colorful bursts.</desc>
  <defs>
    <style>
      [data-wordmark-backing="composite"] {
        animation: paper-backing-in 400ms cubic-bezier(.16, 1, .3, 1) 50ms both;
      }

      [data-wordmark-letter] {
        transform-box: fill-box;
        transform-origin: center;
        animation: paper-letter-in 470ms cubic-bezier(.16, 1, .3, 1) both;
      }
      [data-wordmark-letter="letterA"] { --tilt: -4.2deg; animation-delay: 100ms; }
      [data-wordmark-letter="letterC"] { --tilt: 3.2deg; animation-delay: 160ms; }
      [data-wordmark-letter="letterP"] { --tilt: -2.8deg; animation-delay: 220ms; }
      [data-wordmark-letter="letterU"] { --tilt: 2.8deg; animation-delay: 280ms; }
      [data-wordmark-letter="letterS"] { --tilt: -3.8deg; animation-delay: 340ms; }

      [data-burst] {
        transform-box: fill-box;
        transform-origin: center;
        animation: paper-burst-in 300ms cubic-bezier(.16, 1, .3, 1) both;
      }
      [data-burst^="left"] { --burst-x: 44px; }
      [data-burst^="right"] { --burst-x: -44px; }
      [data-burst$="top"] { --burst-y: 18px; --burst-tilt: -11deg; animation-delay: 720ms; }
      [data-burst$="middle"] { --burst-y: 0px; --burst-tilt: 8deg; animation-delay: 780ms; }
      [data-burst$="bottom"] { --burst-y: -16px; --burst-tilt: -9deg; animation-delay: 840ms; }

      @keyframes paper-backing-in {
        from { opacity: 0; }
      }
      @keyframes paper-letter-in {
        0% { opacity: 0; transform: translateY(-40px) rotate(var(--tilt)) scale(.85); }
        78% { opacity: 1; transform: translateY(2px) rotate(0deg) scale(1.02, .98); }
        100% { opacity: 1; transform: none; }
      }
      @keyframes paper-burst-in {
        from {
          opacity: 0;
          transform: translate(var(--burst-x), var(--burst-y)) rotate(var(--burst-tilt)) scale(.28);
        }
        to { opacity: 1; transform: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        [data-wordmark-backing], [data-wordmark-letter], [data-burst] { animation: none; }
      }
    </style>
    <pattern id="paper" width="43" height="37" patternUnits="userSpaceOnUse">
      <rect width="43" height="37" fill="#FBF6EB"/>
      <g fill="#252828" opacity=".055"><circle cx="4" cy="8" r=".8"/><circle cx="18" cy="5" r=".55"/><circle cx="34" cy="15" r=".7"/><circle cx="11" cy="29" r=".5"/><circle cx="38" cy="33" r=".45"/></g>
      <g fill="#fff" opacity=".48"><circle cx="9" cy="14" r=".7"/><circle cx="27" cy="3" r=".45"/><circle cx="24" cy="25" r=".6"/><circle cx="41" cy="22" r=".5"/></g>
    </pattern>
    <pattern id="blueInk" width="29" height="31" patternUnits="userSpaceOnUse">
      <rect width="29" height="31" fill="#0A46D4"/>
      <g fill="#FBF6EB" opacity=".19"><circle cx="3" cy="8" r=".8"/><circle cx="13" cy="3" r=".55"/><circle cx="24" cy="13" r=".7"/><circle cx="8" cy="24" r=".45"/><circle cx="21" cy="27" r=".65"/></g>
      <g fill="#001B71" opacity=".12"><circle cx="18" cy="17" r=".45"/><circle cx="27" cy="4" r=".35"/><circle cx="2" cy="29" r=".35"/></g>
    </pattern>
    <pattern id="orangeInk" width="31" height="27" patternUnits="userSpaceOnUse">
      <rect width="31" height="27" fill="#FA7408"/>
      <g fill="#FBF6EB" opacity=".2"><circle cx="5" cy="5" r=".7"/><circle cx="17" cy="3" r=".5"/><circle cx="27" cy="10" r=".75"/><circle cx="10" cy="19" r=".45"/><circle cx="24" cy="24" r=".6"/></g>
      <g fill="#B44100" opacity=".1"><circle cx="17" cy="14" r=".45"/><circle cx="2" cy="25" r=".35"/></g>
    </pattern>
    <pattern id="ink" width="37" height="33" patternUnits="userSpaceOnUse">
      <rect width="37" height="33" fill="#252828"/>
      <g fill="#FBF6EB" opacity=".13"><circle cx="4" cy="7" r=".7"/><circle cx="16" cy="4" r=".45"/><circle cx="30" cy="12" r=".75"/><circle cx="9" cy="26" r=".5"/><circle cx="27" cy="29" r=".55"/></g>
      <g fill="#000" opacity=".12"><circle cx="21" cy="18" r=".45"/><circle cx="35" cy="3" r=".35"/></g>
    </pattern>
    <pattern id="dotsBlue" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(8)"><circle cx="3" cy="3" r="2.2" fill="#0A46D4"/></pattern>
    <pattern id="dotsInk" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)"><circle cx="3" cy="3" r="2.1" fill="#252828"/></pattern>
  </defs>
  <rect width="1672" height="720" fill="url(#paper)"/>
