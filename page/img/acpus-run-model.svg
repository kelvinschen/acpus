<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="560" viewBox="0 0 1160 560" role="img" aria-labelledby="title desc">
  <title id="title">Acpus run model</title>
  <desc id="desc">A current Acpus workflow model showing a Workflow Spec compiled to frozen IR, submitted to the local Run Supervisor, executed as nodes, and inspected through the TUI.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#16305f" flood-opacity="0.13"/>
    </filter>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#e8f1ff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8e4"/>
      <stop offset="1" stop-color="#f5e2ac"/>
    </linearGradient>
    <marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3">
      <path d="M0,0 L8,3 L0,6 Z" fill="#173a7a"/>
    </marker>
  </defs>

  <rect width="1160" height="560" rx="28" fill="#fbf8ef"/>
  <path d="M72 90 H1088" stroke="#c8b98a" stroke-width="1"/>
  <text x="580" y="58" text-anchor="middle" font-family="Georgia, serif" font-size="34" fill="#1a1a1a">From Workflow Spec to Durable Run</text>

  <g font-family="IBM Plex Sans, Arial, sans-serif" fill="#1a1a1a">
    <g filter="url(#shadow)">
      <rect x="70" y="135" width="210" height="260" rx="14" fill="#ffffff" stroke="#2f6fd6" stroke-width="2"/>
      <text x="95" y="177" font-size="22" font-weight="700" fill="#0b3c91">Workflow Spec</text>
      <text x="95" y="211" font-size="15" fill="#444">YAML inputs, agents,</text>
      <text x="95" y="233" font-size="15" fill="#444">steps, control flow,</text>
      <text x="95" y="255" font-size="15" fill="#444">and outputs.</text>
      <rect x="95" y="292" width="150" height="32" rx="7" fill="#eef5ff" stroke="#7aa7e8"/>
      <text x="170" y="314" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#0b3c91">review.yaml</text>
      <text x="95" y="356" font-family="IBM Plex Mono, monospace" font-size="13" fill="#555">acpus workflows lint</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="355" y="135" width="210" height="260" rx="14" fill="url(#blue)" stroke="#2f6fd6" stroke-width="2"/>
      <text x="385" y="177" font-size="22" font-weight="700" fill="#0b3c91">Frozen IR</text>
      <text x="385" y="211" font-size="15" fill="#444">Compiled plan with</text>
      <text x="385" y="233" font-size="15" fill="#444">stable Node keys and</text>
      <text x="385" y="255" font-size="15" fill="#444">deterministic replay.</text>
      <rect x="385" y="292" width="150" height="32" rx="7" fill="#fff" stroke="#7aa7e8"/>
      <text x="460" y="314" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#0b3c91">--dry-run</text>
      <text x="385" y="356" font-family="IBM Plex Mono, monospace" font-size="13" fill="#555">schedule projection</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="640" y="135" width="230" height="260" rx="14" fill="#ffffff" stroke="#b7892c" stroke-width="2"/>
      <text x="670" y="177" font-size="22" font-weight="700" fill="#7a5411">Run Supervisor</text>
      <text x="670" y="211" font-size="15" fill="#444">Workspace-local engine</text>
      <text x="670" y="233" font-size="15" fill="#444">for runs, controls,</text>
      <text x="670" y="255" font-size="15" fill="#444">artifacts, and replay.</text>
      <rect x="670" y="292" width="165" height="32" rx="7" fill="#fff8e4" stroke="#d4a63f"/>
      <text x="752" y="314" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="14" fill="#7a5411">.acpus/state</text>
      <text x="670" y="356" font-family="IBM Plex Mono, monospace" font-size="13" fill="#555">runs pause / retry</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="945" y="135" width="145" height="105" rx="14" fill="#f5fff2" stroke="#3b9b52" stroke-width="2"/>
      <text x="1017" y="174" text-anchor="middle" font-size="20" font-weight="700" fill="#216834">Agent Step</text>
      <text x="1017" y="207" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="#444">acpx codex</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="945" y="290" width="145" height="105" rx="14" fill="#fff7f7" stroke="#d65353" stroke-width="2"/>
      <text x="1017" y="329" text-anchor="middle" font-size="20" font-weight="700" fill="#8e2b2b">Program Step</text>
      <text x="1017" y="362" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="#444">local command</text>
    </g>

    <path d="M282 265 H348" stroke="#173a7a" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
    <path d="M568 265 H632" stroke="#173a7a" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
    <path d="M872 238 C905 220 910 190 938 186" stroke="#173a7a" stroke-width="3" marker-end="url(#arrow)" fill="none"/>
    <path d="M872 318 C905 340 910 340 938 342" stroke="#173a7a" stroke-width="3" marker-end="url(#arrow)" fill="none"/>

    <g>
      <rect x="245" y="435" width="670" height="58" rx="12" fill="#1a1a1a"/>
      <text x="275" y="470" font-family="IBM Plex Mono, monospace" font-size="16" fill="#f5f1e6">acpus runs visualize</text>
      <text x="500" y="470" font-size="15" fill="#cfc7ad">inspect Node state, artifacts, prompts, outputs, and controls</text>
    </g>
  </g>
</svg>
