<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">Acpus user workflow: Workflow Spec to Run to reusable agent and program nodes</title>
  <desc id="desc">A user writes a Workflow Spec, starts a Run, collects context with a program node, fans out review and test work, loops repair attempts, checks a guard, and ships structured output.</desc>
  <defs>
    <marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="7" refY="4">
      <path d="M0,0 L8,4 L0,8 Z" fill="#8f6b22" />
    </marker>
    <style>
      .bg { fill: #fbf8ef; }
      .rule { stroke: #c8b98a; stroke-width: 1.4; }
      .arrow { fill: none; stroke: #8f6b22; stroke-width: 1.7; marker-end: url(#arrow); }
      .box { fill: #f5f1e6; stroke: #1a1a1a; stroke-width: 1.4; }
      .soft { fill: #fffaf0; stroke: #c8b98a; stroke-width: 1.2; }
      .pill { fill: #1a1a1a; }
      .gold { fill: #b7892c; }
      .ink { fill: #1a1a1a; }
      .muted { fill: #555; }
      .title { font: 600 18px Georgia, serif; }
      .label { font: 600 13px Arial, sans-serif; }
      .small { font: 11px Arial, sans-serif; }
      .mono { font: 500 10px "IBM Plex Mono", ui-monospace, monospace; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="980" height="430" />
  <rect class="rule" x="16" y="16" width="948" height="398" fill="none" />

  <text class="title ink" x="42" y="55">Ship a change with agent-orchestrated workflow</text>
  <text class="small muted" x="42" y="78">Acpus turns one YAML spec into a durable local run with agent steps, program steps, parallel work, loops, guards, and inspectable output.</text>

  <rect class="box" x="42" y="122" width="128" height="78" rx="4" />
  <text class="mono gold" x="62" y="147">YAML</text>
  <text class="label ink" x="62" y="169">Workflow Spec</text>
  <text class="small muted" x="62" y="188">intent + agents</text>

  <rect class="box" x="216" y="122" width="112" height="78" rx="4" />
  <text class="mono gold" x="245" y="147">RUN</text>
  <text class="label ink" x="244" y="169">Acpus Run</text>
  <text class="small muted" x="239" y="188">durable state</text>

  <path class="arrow" d="M170 161 H207" />
  <path class="arrow" d="M328 161 H374" />

  <rect class="soft" x="382" y="104" width="146" height="114" rx="4" />
  <rect class="pill" x="404" y="124" width="68" height="20" rx="10" />
  <text class="mono" x="418" y="138" fill="#f5f1e6">PROGRAM</text>
  <text class="label ink" x="404" y="169">Collect context</text>
  <text class="small muted" x="404" y="188">git status, tests, files</text>
  <text class="small muted" x="404" y="204">deterministic inputs</text>

  <path class="arrow" d="M528 161 H578" />

  <rect class="soft" x="588" y="64" width="170" height="154" rx="4" />
  <text class="mono gold" x="610" y="90">PARALLEL</text>
  <rect class="box" x="610" y="108" width="126" height="42" rx="4" />
  <text class="label ink" x="629" y="134">Agent review</text>
  <rect class="box" x="610" y="160" width="126" height="42" rx="4" />
  <text class="label ink" x="630" y="186">Program test</text>

  <path class="arrow" d="M758 141 H806" />
  <path class="arrow" d="M758 181 C778 181 786 181 806 181" />

  <rect class="soft" x="816" y="104" width="122" height="114" rx="4" />
  <text class="mono gold" x="846" y="130">LOOP</text>
  <text class="label ink" x="845" y="156">Repair</text>
  <text class="small muted" x="842" y="176">agent attempts</text>
  <text class="small muted" x="836" y="194">until checks pass</text>
  <path class="arrow" d="M906 214 C924 246 813 250 834 214" />

  <path class="arrow" d="M877 218 V264" />

  <rect class="box" x="586" y="278" width="170" height="78" rx="4" />
  <text class="mono gold" x="645" y="303">GUARD</text>
  <text class="label ink" x="621" y="326">Approve or fail</text>
  <text class="small muted" x="617" y="344">human gate, policy, signal</text>

  <path class="arrow" d="M816 317 H766" />
  <path class="arrow" d="M586 317 H522" />

  <rect class="box" x="374" y="278" width="148" height="78" rx="4" />
  <text class="mono gold" x="418" y="303">OUTPUT</text>
  <text class="label ink" x="409" y="326">Ship result</text>
  <text class="small muted" x="401" y="344">JSON, artifacts, replay</text>

  <path class="arrow" d="M374 317 C290 317 272 238 272 210" />

  <text class="small muted" x="42" y="388">Inspect and control the Run at any point: visualize, pause, resume, retry a node, signal approval, or replay from the frozen snapshot.</text>
</svg>
