version: 1
name: program-pipeline-loop-switch
input:
  mode: string
workflow:
  steps:
    - id: build
      pipeline:
        - id: seed
          run: program
          cmd: ["node", "-e", "console.log(JSON.stringify({ base: 2 }))"]
          capture: { from: stdout, parse: json }
          output:
            base: integer

        - id: iterate
          loop:
            until: loop.iter >= 3
            max_iterations: 3
            do:
              - id: tick
                run: program
                cmd:
                  - node
                  - -e
                  - |
                    console.log(JSON.stringify({
                      iter: Number(process.argv[1]),
                      value: Number(process.argv[2]) + Number(process.argv[1])
                    }))
                  - ${{ loop.iter }}
                  - ${{ steps.seed.output.base }}
                capture: { from: stdout, parse: json }
                output:
                  iter: integer
                  value: integer

        - id: choose
          switch:
            cases:
              - when: input.mode == "double"
                do:
                  - id: double_it
                    run: program
                    cmd:
                      - node
                      - -e
                      - |
                        console.log(JSON.stringify({
                          mode: 'double',
                          value: Number(process.argv[1]) * 2
                        }))
                      - ${{ steps.iterate.output.value }}
                    capture: { from: stdout, parse: json }
                    output:
                      mode: string
                      value: integer
            default:
              do:
                - id: keep_it
                  run: program
                  cmd:
                    - node
                    - -e
                    - |
                      console.log(JSON.stringify({
                        mode: 'keep',
                        value: Number(process.argv[1])
                      }))
                    - ${{ steps.iterate.output.value }}
                  capture: { from: stdout, parse: json }
                  output:
                    mode: string
                    value: integer
      outputs:
        seed: ${{ steps.seed.output.base }}
        iter: ${{ steps.iterate.output.iter }}
        selected_mode: ${{ steps.choose.output.mode }}
        final_value: ${{ steps.choose.output.value }}
outputs:
  final_value: ${{ steps.build.output.final_value }}
  selected_mode: ${{ steps.build.output.selected_mode }}
  loop_iter: ${{ steps.build.output.iter }}
