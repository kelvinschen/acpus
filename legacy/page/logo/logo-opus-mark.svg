<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Acpus Ap ligature — swash entwined">
  <title>Acpus — Ap Ligature (swash entwined)</title>
  <desc>Roman capital A interlocked with italic lowercase p, tied by a hairline swash and a gilded knot. Classical print-page framing.</desc>

  <!-- Paper -->
  <rect width="240" height="240" fill="#F5F1E6"/>

  <!-- Frontispiece borders (inner usable area: 20..220) -->
  <rect x="14" y="14" width="212" height="212" fill="none" stroke="#1A1A1A" stroke-width="1"/>
  <rect x="20" y="20" width="200" height="200" fill="none" stroke="#1A1A1A" stroke-width="0.5"/>

  <!-- Top motto -->
  <text x="120" y="44" text-anchor="middle"
        font-family="'Cormorant Garamond','EB Garamond','Times New Roman',Georgia,serif"
        font-style="italic" font-size="13" fill="#1A1A1A" letter-spacing="2">
    every run, an opus
  </text>

  <!-- Ornate divider with star -->
  <g stroke="#1A1A1A" stroke-width="1" fill="none">
    <line x1="48" y1="58" x2="105" y2="58"/>
    <line x1="135" y1="58" x2="192" y2="58"/>
  </g>
  <text x="120" y="63" text-anchor="middle"
        font-family="'Cormorant Garamond',serif" font-size="16" fill="#B7892C">✦</text>

  <!--
    ===== Ap ligature (swash) =====
    Glyph zone: y=78 (apex) to y=170 (p descender end). Font-size 96.
    A baseline y=152, p baseline y=152 (italic descender extends to ~y=170).
  -->
  <g font-family="'EB Garamond','Cormorant Garamond','Times New Roman',Georgia,serif"
     font-size="96" font-weight="500" fill="#1A1A1A">
    <!-- A (Roman, large) -->
    <text x="92" y="152" text-anchor="middle">A</text>
    <!-- p (italic), overlapping right side of A -->
    <text x="142" y="152" text-anchor="middle" font-style="italic">p</text>
  </g>

  <!-- Coupling swash: arcs from A's apex right-and-down, loops over p's bowl -->
  <path d="
    M 92 86
    C 90 70 118 64 138 72
    C 158 80 168 96 162 116
    C 158 128 148 130 140 122
  " fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Gilded knot where swash meets p -->
  <circle cx="138" cy="72" r="3.5" fill="#B7892C"/>

  <!-- Decorative short rule echoing the top divider -->
  <line x1="96" y1="194" x2="144" y2="194" stroke="#C8B98A" stroke-width="0.75"/>

  <!-- Wordmark (kept inside inner border y=220) -->
  <text x="120" y="210" text-anchor="middle"
        font-family="'Cormorant Garamond',serif"
        font-size="11" fill="#1A1A1A" letter-spacing="5" font-weight="500">
    A C P U S
  </text>
</svg>
