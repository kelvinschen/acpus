version: 1
name: skill-optimizer
description: |
  Iteratively optimize an agent skill through automated
  execute-evaluate-improve loops. Program steps own state, paths,
  aggregation, line budgets, and loop control; agent steps only do
  judgment work.

  Focus (input.focus, default "quality") selects the optimization dimension:
  quality, format, speed, compliance, recall, conciseness, freedom, model-fit.
  Unknown focus values are treated as custom preferences on top of quality.

input:
  skill_path: string
  focus?: string = "quality"
  max_iterations?: integer = 6
  test_case_count?: integer = 3
  output_root?: string = ".acpus/output/skill-optimizer"
  eval_cases_path?: string = ""
  recall_runs_per_query?: integer = 3
  trigger_threshold?: number = 0.5

agents:
  test_designer:
    use: traex
  executor:
    use: claude
  evaluator:
    use: claude
  improver:
    use: codex

workflow:
  steps:
    - id: init
      run: program
      cmd:
        - node
        - ${{ workflow.source_dir }}/scripts/skill-optimizer.mjs
        - init
        - ${{ input.skill_path }}
        - ${{ input.output_root }}
        - ${{ run_id }}
        - ${{ input.focus }}
        - ${{ input.max_iterations }}
        - ${{ input.test_case_count }}
        - ${{ input.eval_cases_path }}
        - ${{ input.trigger_threshold }}
        - ${{ input.recall_runs_per_query }}
      capture:
        from: stdout
        parse: json
      output:
        output_dir: string
        state_path: string
        report_path: string
        skill_dir: string
        skill_name: string
        skill_rel_path: string
        worktree_path: string
        patch_path: string
        original_line_count: integer
        line_budget: integer
        max_iterations: integer
        test_case_count: integer
        eval_cases_path: string
        trigger_threshold: number
        recall_runs_per_query: integer
        focus: string
      timeout: 30s

    - id: design_tests
      if:
        condition: input.eval_cases_path == ""
        then:
          - id: generate_tests
            run: agent
            use: test_designer
            timeout: 10m
            prompt: |
              You are designing the final eval set for an agent skill optimizer.

              Skill directory:
              ${{ steps.init.output.skill_dir }}

              Optimization focus:
              ${{ steps.init.output.focus }}

              Design exactly ${{ steps.init.output.test_case_count }} final test
              cases. Each case should be realistic, concrete, discriminating,
              and executable by a fresh agent in this repository.

              Read the skill before designing tests.

              Good prompts look like real user requests:
              - concrete enough to act on;
              - with filenames, issue numbers, labels, user context, or
                repository paths when those details matter;
              - enough substance that the skill would actually help;
              - self-contained, with any needed session history, source
                material, user decisions, files, or in-progress plan included
                directly in the prompt or as explicit existing paths.

              Avoid weak prompts:
              - abstract one-liners that any agent can handle without the skill;
              - hidden-context tasks like "continue the previous refactor";
              - requests that require discovering an unstated plan from git history;
              - broad repository research unless broad research is the skill's
                actual purpose.

              Include coverage:
              - at least one normal should_trigger=true case;
              - if the count allows it, one tricky near-miss
                should_trigger=false case that shares vocabulary with the
                skill but needs a different workflow;
              - focus-specific cases that expose the optimization dimension.

              For recall focus, design raw trigger queries only: no output
              path, no test id, no "eval task" wording. Positive cases must
              be substantive requests where the skill should naturally help;
              negative cases must be near-misses, not unrelated easy tasks.

              For each case, include concise expected_behavior items when
              they are obvious.

              Return JSON with test_cases only. These are the final generated
              eval cases.
            output:
              test_cases:
                - id: string
                  prompt: string
                  should_trigger?: boolean
                  expected_behavior?:
                    - string
                  files?:
                    - string
                  split?: string
        else:
          - id: skip_generated_tests
            run: program
            cmd:
              - node
              - -e
              - "console.log(JSON.stringify({test_cases:[]}))"
            capture:
              from: stdout
              parse: json
            output:
              test_cases:
                - id: string
                  prompt: string
                  should_trigger?: boolean
                  files?:
                    - string

    - id: normalize_tests
      run: program
      cmd:
        - node
        - ${{ workflow.source_dir }}/scripts/skill-optimizer.mjs
        - normalize-tests
        - ${{ steps.init.output.state_path }}
      env:
        TEST_CASES: ${{ json(steps.design_tests.output.test_cases) }}
      capture:
        from: stdout
        parse: json
      output:
        tests_path: string
        test_count: integer
        test_cases:
          - id: string
            key: string
            prompt: string
            should_trigger: boolean
            split: string
            files:
              - string
      timeout: 30s

    - id: optimize
      loop:
        max_iterations: 51
        until: (loop.iter > 0 && loop.last.done) || loop.iter > input.max_iterations
        do:
          - id: prepare_round
            run: program
            cmd:
              - node
              - ${{ workflow.source_dir }}/scripts/skill-optimizer.mjs
              - prepare-round
              - ${{ steps.init.output.state_path }}
              - ${{ loop.iter }}
            capture:
              from: stdout
              parse: json
            output:
              round: integer
              skill_dir: string
              worktree_path: string
              round_dir: string
              improvement_manifest_path: string
              summary_path: string
              improvement_summary_path: string
              case_jobs:
                - key: string
                  test_key: string
                  test_id: string
                  prompt: string
                  should_trigger: boolean
                  split: string
                  files:
                    - string
                  run_index: integer
                  result_path: string
                  case_context_path: string
                  checks_path: string
                  used_skills_path: string
                  raw_eval_path: string
                  normalized_eval_path: string
                  trigger_result_path: string
                  execution_prompt: string
            timeout: 30s

          - id: round_eval
            if:
              condition: steps.init.output.focus == "recall"
              then:
                - id: run_trigger_cases
                  fanout:
                    over: steps.prepare_round.output.case_jobs
                    key: "${{ item.key }}"
                    join: all
                    do:
                      - id: trigger_executor
                        run: agent
                        use: executor
                        cwd: "${{ steps.prepare_round.output.worktree_path }}"
                        session_key: skill-optimizer-trigger-${{ item.key }}
                        timeout: 15m
                        prompt: |
                          ${{ item.execution_prompt }}

                      - id: report_skills
                        run: agent
                        use: executor
                        cwd: "${{ steps.prepare_round.output.worktree_path }}"
                        session_key: skill-optimizer-trigger-${{ item.key }}
                        timeout: 5m
                        prompt: |
                          For the task you just completed, report which agent
                          skills you actually loaded or applied while doing it.

                          List only skills you genuinely used, by name or
                          path. Do not list skills you merely noticed were
                          available. If you used none, return an empty list.
                        output:
                          used_skills:
                            - string
                          reason: string

                      - id: collect_trigger_report
                        run: program
                        cmd:
                          - node
                          - ${{ workflow.source_dir }}/scripts/skill-optimizer.mjs
                          - collect-trigger-report
                          - ${{ steps.init.output.state_path }}
                          - ${{ item.test_key }}
                          - ${{ item.key }}
                          - ${{ item.trigger_result_path }}
                        env:
                          USED_SKILLS: ${{ json(steps.report_skills.output.used_skills) }}
                          REASON: ${{ steps.report_skills.output.reason }}
                        capture:
                          from: stdout
                          parse: json
                        output:
                          test_id: string
                          test_key: string
                          key: string
                          triggered: boolean
                          used_target_skill: boolean
                          trigger_result_path: string
                        timeout: 30s

                - id: aggregate_trigger_round
                  run: program
                  cmd:
                    - node
                    - ${{ workflow.source_dir }}/scripts/skill-optimizer.mjs
                    - aggregate-trigger-eval
                    - ${{ steps.init.output.state_path }}
                    - ${{ loop.iter }}
                  env:
                    TRIGGER_RESULTS: ${{ json(steps.run_trigger_cases.output) }}
                  capture:
                    from: stdout
                    parse: json
                  output: &round_eval_output
                    round: integer
                    avg_score: number
                    train_avg_score: number
                    holdout_avg_score: number
                    best_score: number
                    current_best_score: number
                    can_improve: boolean
                    evaluation_count: integer
                    train_count: integer
                    holdout_count: integer
                    weakest_test: string
                    weakest_score: number
                    weakest_dimension: string
                    stagnation_rounds: integer
                    skill_line_count: integer
                    original_line_count: integer
                    line_budget: integer
                    violation_count: integer
                    check_pass_rate: number
                    summary_path: string
                    improvement_summary_path: string
                  timeout: 30s
              else:
                - id: run_cases
                  fanout:
                    over: steps.prepare_round.output.case_jobs
                    key: "${{ item.key }}"
                    join: all
                    do:
                        - id: executor
                          run: agent
                          use: executor
                          cwd: "${{ steps.prepare_round.output.worktree_path }}"
                          timeout: 15m
                          prompt: |
                            ${{ item.execution_prompt }}
                          output:
                            result_path: string
                            used_skills:
                              - string

                        - id: collect_case
                          run: program
                          cmd:
                            - node
                            - ${{ workflow.source_dir }}/scripts/skill-optimizer.mjs
                            - collect-case
                            - ${{ steps.init.output.state_path }}
                            - ${{ loop.iter }}
                            - ${{ item.key }}
                            - ${{ steps.executor.output.result_path }}
                            - ${{ item.case_context_path }}
                            - ${{ item.used_skills_path }}
                            - ${{ run_id }}
                            - ${{ item_index }}
                          env:
                            USED_SKILLS: ${{ json(steps.executor.output.used_skills) }}
                          capture:
                            from: stdout
                            parse: json
                          output:
                            result_path: string
                            case_context_path: string
                            used_skills_path: string
                            used_target_skill: boolean
                            telemetry_path: string
                            transcript_path: string
                            tool_call_count: integer
                            had_result: boolean
                          timeout: 30s

                        - id: run_checks
                          run: program
                          cmd:
                            - node
                            - ${{ workflow.source_dir }}/scripts/skill-optimizer.mjs
                            - run-checks
                            - ${{ steps.init.output.state_path }}
                            - ${{ loop.iter }}
                            - ${{ item.key }}
                            - ${{ steps.collect_case.output.result_path }}
                            - ${{ item.checks_path }}
                            - ${{ steps.collect_case.output.tool_call_count }}
                          capture:
                            from: stdout
                            parse: json
                          output:
                            key: string
                            checks_path: string
                            checks_total: integer
                            checks_passed: integer
                            check_pass_rate: number
                          timeout: 30s

                        - id: evaluator
                          run: agent
                          use: evaluator
                          session_key: skill-optimizer-evaluator-${{ item.key }}
                          timeout: 10m
                          prompt: |
                            You are a skill quality evaluator.

                            Optimization focus:
                            ${{ steps.init.output.focus }}

                            Read this prepared case context:
                            ${{ steps.collect_case.output.case_context_path }}

                            Read deterministic check results:
                            ${{ steps.run_checks.output.checks_path }}

                            It contains the skill directory, test prompt, executor
                            result path, telemetry path, and transcript path when
                            available. Use those files to evaluate the run without
                            assuming a specific agent product or tool UI. Do not
                            calculate the final weighted score; the workflow computes it.

                            Evaluate these rubric dimensions from 0 to 10:
                            - correctness_score: output correctness and completeness
                            - process_score: whether the executor followed an appropriate workflow
                            - compliance_score: adherence to explicit SKILL.md rules
                            - efficiency_score: unnecessary or missed steps, tool use, thrashing
                            - triggering_score: whether the skill should have applied to this prompt
                            - violated_rules: only rules explicitly stated in SKILL.md
                              that the executor clearly ignored.

                            Write one JSON object to this file:
                            ${{ item.raw_eval_path }}

                            Required fields:
                            - test_id: string
                            - correctness_score: number from 0 to 10
                            - process_score: number from 0 to 10
                            - compliance_score: number from 0 to 10
                            - efficiency_score: number from 0 to 10
                            - triggering_score: number from 0 to 10
                            - can_improve: boolean
                            - rubric_notes: array of strings
                            - strengths: array of strings
                            - weaknesses: array of strings
                            - suggestions: array of strings
                            - violated_rules: array of strings

                            Do not write any other file for the evaluation.

                        - id: normalize_eval
                          run: program
                          cmd:
                            - node
                            - ${{ workflow.source_dir }}/scripts/skill-optimizer.mjs
                            - normalize-eval
                            - ${{ steps.init.output.state_path }}
                            - ${{ loop.iter }}
                            - ${{ item.key }}
                            - ${{ item.raw_eval_path }}
                            - ${{ item.normalized_eval_path }}
                            - ${{ steps.run_checks.output.checks_path }}
                            - ${{ steps.collect_case.output.used_skills_path }}
                            - ${{ run_id }}
                            - ${{ item_index }}
                          capture:
                            from: stdout
                            parse: json
                          output:
                            test_id: string
                            key: string
                            score: number
                            can_improve: boolean
                            valid: boolean
                            evaluation_path: string
                          timeout: 30s

                - id: aggregate_round
                  run: program
                  cmd:
                    - node
                    - ${{ workflow.source_dir }}/scripts/skill-optimizer.mjs
                    - aggregate-round
                    - ${{ steps.init.output.state_path }}
                    - ${{ loop.iter }}
                  env:
                    EVALUATIONS: ${{ json(steps.run_cases.output) }}
                  capture:
                    from: stdout
                    parse: json
                  output: *round_eval_output
                  timeout: 30s

          - id: record_evaluated
            run: program
            cmd:
              - node
              - ${{ workflow.source_dir }}/scripts/skill-optimizer.mjs
              - record-evaluated
              - ${{ steps.init.output.state_path }}
            capture:
              from: stdout
              parse: json
            output:
              round: integer
              baseline: boolean
              evaluated_sha: string
              best_evaluated_sha: string
              best_evaluated_score: number
            timeout: 30s

          - id: maybe_improve
            if:
              condition: loop.iter < input.max_iterations
              then:
                - id: improve_skill
                  run: agent
                  use: improver
                  cwd: "${{ steps.prepare_round.output.worktree_path }}"
                  session_key: skill-optimizer-improver
                  timeout: 15m
                  prompt: |
                    You are a skill improver.

                    Optimization focus:
                    ${{ steps.init.output.focus }}

                    Current skill directory:
                    ${{ steps.prepare_round.output.skill_dir }}

                    Edit the skill in place inside this isolated worktree:
                    ${{ steps.prepare_round.output.worktree_path }}

                    Write an improvement manifest JSON object to:
                    ${{ steps.prepare_round.output.improvement_manifest_path }}

                    Manifest fields:
                    - can_improve: boolean
                    - changed: boolean
                    - changes_summary: array of strings

                    Iteration:
                    ${{ loop.iter }}

                    Evaluation summary:
                    - Weighted average score: ${{ steps.round_eval.output.avg_score }}
                    - Train average score: ${{ steps.round_eval.output.train_avg_score }}
                    - Holdout average score: ${{ steps.round_eval.output.holdout_avg_score }}
                    - Best score so far: ${{ steps.round_eval.output.best_score }}
                    - Stagnation rounds: ${{ steps.round_eval.output.stagnation_rounds }}
                    - Weakest test: ${{ steps.round_eval.output.weakest_test }}
                    - Weakest score: ${{ steps.round_eval.output.weakest_score }}
                    - Weakest dimension: ${{ steps.round_eval.output.weakest_dimension }}
                    - Violation count: ${{ steps.round_eval.output.violation_count }}
                    - Deterministic check pass rate: ${{ steps.round_eval.output.check_pass_rate }}
                    - Current skill line count: ${{ steps.round_eval.output.skill_line_count }}
                    - Original skill line count: ${{ steps.round_eval.output.original_line_count }}
                    - Line budget: ${{ steps.round_eval.output.line_budget }}

                    Train-only improvement details:
                    ${{ steps.round_eval.output.improvement_summary_path }}

                    Rules:
                    - Read the current SKILL.md and referenced files before editing.
                    - Read the train-only improvement details before editing.
                    - Modify only the skill directory inside the isolated worktree.
                    - Keep SKILL.md at or below the line budget.
                    - Move detailed examples/checklists into references/ when needed.
                    - Do not overfit one test case; generalize across the evaluation.
                    - Do not use holdout-only feedback to choose edits.
                    - Preserve frontmatter unless recall/triggering is the problem.
                    - In recall focus, prefer improving frontmatter description;
                      leave body workflow quality for a separate non-recall pass.
                    - If no useful improvement remains, leave the skill unchanged and
                      set changed=false in the manifest.

                    Do not rely on final-message JSON. The manifest file is the
                    contract consumed by the workflow.

                - id: commit_candidate
                  run: program
                  cmd:
                    - node
                    - ${{ workflow.source_dir }}/scripts/skill-optimizer.mjs
                    - commit-candidate
                    - ${{ steps.init.output.state_path }}
                  capture:
                    from: stdout
                    parse: json
                  output:
                    round: integer
                    committed: boolean
                    sha: string
                  timeout: 30s
              else:
                - id: skip_improve
                  run: program
                  cmd:
                    - node
                    - -e
                    - "console.log(JSON.stringify({round:0,committed:false,sha:''}))"
                  capture:
                    from: stdout
                    parse: json
                  output:
                    round: integer
                    committed: boolean
                    sha: string

          - id: finish_round
            run: program
            cmd:
              - node
              - ${{ workflow.source_dir }}/scripts/skill-optimizer.mjs
              - finish-round
              - ${{ steps.init.output.state_path }}
              - ${{ loop.iter }}
            capture:
              from: stdout
              parse: json
            output:
              round: integer
              done: boolean
              can_improve: boolean
              skill_dir: string
              avg_score: number
              train_avg_score: number
              holdout_avg_score: number
              best_score: number
              stagnation_rounds: integer
              stop_reason: string
              summary_path: string
              report_path: string
            timeout: 30s

    - id: finalize
      run: program
      cmd:
        - node
        - ${{ workflow.source_dir }}/scripts/skill-optimizer.mjs
        - finalize
        - ${{ steps.init.output.state_path }}
      capture:
        from: stdout
        parse: json
      output:
        skill_dir: string
        final_score: number
        best_score: number
        rounds_completed: integer
        report_path: string
        state_path: string
        output_dir: string
        worktree_path: string
        patch_path: string
        stop_reason: string
      timeout: 30s

outputs:
  skill_dir: ${{ steps.finalize.output.skill_dir }}
  final_score: ${{ steps.finalize.output.final_score }}
  best_score: ${{ steps.finalize.output.best_score }}
  rounds_completed: ${{ steps.finalize.output.rounds_completed }}
  report_path: ${{ steps.finalize.output.report_path }}
  state_path: ${{ steps.finalize.output.state_path }}
  output_dir: ${{ steps.finalize.output.output_dir }}
  worktree_path: ${{ steps.finalize.output.worktree_path }}
  patch_path: ${{ steps.finalize.output.patch_path }}
  stop_reason: ${{ steps.finalize.output.stop_reason }}
