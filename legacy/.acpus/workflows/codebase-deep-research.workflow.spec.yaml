version: 1
name: codebase-deep-research
description: |
  Dynamic workflow pattern: fanout-and-synthesize.

  Runs independent research agents over one Acpus codebase from several
  viewpoints, then asks a synthesis agent to cross-check, deduplicate, and
  write a final report. Program Steps only prepare deterministic output
  paths; agents perform the open-ended codebase research and synthesis.

  Output: .acpus/output/codebase-deep-research/<run_id>/
input:
  target_path: string
  research_depth?: string = "deep"
  custom_instructions?: string = "(none)"
  include_patterns?: string = "(none)"
  output_root?: string = ".acpus/output/codebase-deep-research"
agents:
  researcher:
    use: pi
  synthesizer:
    use: pi
workflow:
  steps:
    - id: prepare_output
      run: program
      cmd:
        - bash
        - -c
        - |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib

          out = pathlib.Path("${{ input.output_root }}").resolve() / "${{ run_id }}"
          out.mkdir(parents=True, exist_ok=True)
          reports = {
              "architecture": str(out / "architecture.md"),
              "quality": str(out / "quality.md"),
              "security": str(out / "security.md"),
              "performance": str(out / "performance.md"),
              "api_design": str(out / "api-design.md"),
              "final": str(out / "codebase-deep-research.md"),
          }
          print(json.dumps({"output_dir": str(out), "reports": reports}))
          PY
      capture:
        from: stdout
        parse: json
      output:
        output_dir: string
        reports:
          architecture: string
          quality: string
          security: string
          performance: string
          api_design: string
          final: string
    - id: research
      parallel:
        - id: architecture
          do:
            - id: architecture_step
              run: agent
              use: researcher
              prompt: |
                You are a senior software architect researching an Acpus codebase.
                Keep code identifiers, file paths, and commands verbatim.

                Target repository: `${{ input.target_path }}`
                Include patterns: ${{ input.include_patterns }}
                Depth: ${{ input.research_depth }}

                Research architecture and design:
                - Package/module boundaries and dependency direction.
                - Workflow DSL, compiler, runtime, CLI, and TUI ownership.
                - Data flow from YAML input through IR, interpreter, artifacts, and output.
                - Extension points and places where accidental coupling would hurt future work.
                - Current docs/spec alignment.

                Custom instructions:
                ${{ input.custom_instructions }}

                Write your full Markdown report to:
                ${{ steps.prepare_output.output.reports.architecture }}

                Write boundary:
                - Do not create, modify, or delete files in the target repository.
                - Only write to the report path above, its parent output directory, or a system temporary directory.

                Return JSON with the report path and finding count. Put the
                summary in the Markdown report.
              output:
                report_path: string
                findings_count: integer
              timeout: 25m
        - id: quality
          do:
            - id: quality_step
              run: agent
              use: researcher
              prompt: |
                You are a code quality researcher. Keep identifiers, paths, and
                commands verbatim.

                Target repository: `${{ input.target_path }}`
                Include patterns: ${{ input.include_patterns }}
                Depth: ${{ input.research_depth }}

                Research code quality:
                - Test strategy and meaningful gaps.
                - Type safety, schema validation, and error handling.
                - Duplication, naming, local conventions, and maintainability risks.
                - Places where implementation and specs drift.

                Custom instructions:
                ${{ input.custom_instructions }}

                Write your full Markdown report to:
                ${{ steps.prepare_output.output.reports.quality }}

                Write boundary:
                - Do not create, modify, or delete files in the target repository.
                - Only write to the report path above, its parent output directory, or a system temporary directory.

                Return JSON with the report path and finding count. Put the
                summary in the Markdown report.
              output:
                report_path: string
                findings_count: integer
              timeout: 25m
        - id: security
          do:
            - id: security_step
              run: agent
              use: researcher
              prompt: |
                You are a security and robustness researcher. Keep identifiers,
                paths, and commands verbatim.

                Target repository: `${{ input.target_path }}`
                Include patterns: ${{ input.include_patterns }}
                Depth: ${{ input.research_depth }}

                Research security and robustness:
                - YAML/schema/CEL input validation boundaries.
                - Program execution, acpx invocation, path handling, artifact storage.
                - State persistence, crash recovery, cancellation, retry, and concurrency risks.
                - Secret exposure, command injection, traversal, and unsafe defaults.

                Custom instructions:
                ${{ input.custom_instructions }}

                Write your full Markdown report to:
                ${{ steps.prepare_output.output.reports.security }}

                Write boundary:
                - Do not create, modify, or delete files in the target repository.
                - Only write to the report path above, its parent output directory, or a system temporary directory.

                Return JSON with the report path and finding count. Put the
                summary in the Markdown report.
              output:
                report_path: string
                findings_count: integer
              timeout: 25m
        - id: performance
          do:
            - id: performance_step
              run: agent
              use: researcher
              prompt: |
                You are a performance researcher. Keep identifiers, paths, and
                commands verbatim.

                Target repository: `${{ input.target_path }}`
                Include patterns: ${{ input.include_patterns }}
                Depth: ${{ input.research_depth }}

                Research performance and scale:
                - Interpreter concurrency, fanout/parallel limits, and cancellation behavior.
                - File I/O, artifact growth, JSON parsing, transcript handling, and TUI polling.
                - Hot paths, cold starts, and measurement gaps.

                Custom instructions:
                ${{ input.custom_instructions }}

                Write your full Markdown report to:
                ${{ steps.prepare_output.output.reports.performance }}

                Write boundary:
                - Do not create, modify, or delete files in the target repository.
                - Only write to the report path above, its parent output directory, or a system temporary directory.

                Return JSON with the report path and finding count. Put the
                summary in the Markdown report.
              output:
                report_path: string
                findings_count: integer
              timeout: 25m
        - id: api_design
          do:
            - id: api_design_step
              run: agent
              use: researcher
              prompt: |
                You are an API and developer-experience researcher. Write the report
                with identifiers, paths, and commands verbatim.

                Target repository: `${{ input.target_path }}`
                Include patterns: ${{ input.include_patterns }}
                Depth: ${{ input.research_depth }}

                Research user-facing interfaces:
                - CLI commands, JSON outputs, exit codes, and catalog ergonomics.
                - Workflow DSL, Schema DSL, expression model, and examples.
                - Runtime/TUI inspectability and operator controls.
                - Naming clarity against CONTEXT.md.

                Custom instructions:
                ${{ input.custom_instructions }}

                Write your full Markdown report to:
                ${{ steps.prepare_output.output.reports.api_design }}

                Write boundary:
                - Do not create, modify, or delete files in the target repository.
                - Only write to the report path above, its parent output directory, or a system temporary directory.

                Return JSON with the report path and finding count. Put the
                summary in the Markdown report.
              output:
                report_path: string
                findings_count: integer
              timeout: 25m
    - id: synthesize
      run: agent
      use: synthesizer
      prompt: |
        You are the synthesis lead for a fanout-and-synthesize codebase research
        workflow. Keep code identifiers, file paths, and commands verbatim.

        Target repository: `${{ input.target_path }}`
        Custom instructions: ${{ input.custom_instructions }}

        Read these independent research reports:
        - Architecture: ${{ steps.research.output.architecture.report_path }}
        - Quality: ${{ steps.research.output.quality.report_path }}
        - Security: ${{ steps.research.output.security.report_path }}
        - Performance: ${{ steps.research.output.performance.report_path }}
        - API design: ${{ steps.research.output.api_design.report_path }}

        Synthesize by theme, not by source report. Cross-validate claims that
        appear in multiple reports, downgrade weak evidence, identify gaps, and
        include a prioritized action plan for Acpus maintainers.

        Write the final Markdown report to:
        ${{ steps.prepare_output.output.reports.final }}

        Write boundary:
        - Do not create, modify, or delete files in the target repository.
        - Only write to the final report path above, its parent output directory, or a system temporary directory.

        Return a JSON object with the final report path and counts.
      output:
        report_path: string
        total_findings: integer
        cross_validated: integer
        single_source: integer
        gaps_identified: integer
      timeout: 30m
outputs:
  report_path: ${{ steps.synthesize.output.report_path }}
  output_dir: ${{ steps.prepare_output.output.output_dir }}
  total_findings: ${{ steps.synthesize.output.total_findings }}
  cross_validated: ${{ steps.synthesize.output.cross_validated }}
