version: 1
name: example-review-guard
description: Agent reviews a topic, guard checks for issues, second agent drafts a fix if needed.

input:
  topic: string

agents:
  reviewer:
    use: pi
  drafter:
    use: pi

workflow:
  steps:
    - id: review
      run: agent
      use: reviewer
      timeout: 10m
      prompt: |
        Review the topic and identify issues. Output schema is strict — no extra fields.
        Topic:
        ${{ input.topic }}
      output:
        issue_count: integer
        summary: string

    - id: require_issues
      guard:
        when: steps.review.output.issue_count > 0
        then: continue
        else: complete

    - id: route
      if:
        condition: steps.review.output.issue_count > 3
        then:
          - id: major_route
            run: program
            cmd:
              - node
              - -e
              - |
                console.log(JSON.stringify({route: "major", approval_required: true}));
            capture:
              from: stdout
              parse: json
            output:
              route: string
              approval_required: boolean
        else:
          - id: minor_route
            run: program
            cmd:
              - node
              - -e
              - |
                console.log(JSON.stringify({route: "minor", approval_required: false}));
            capture:
              from: stdout
              parse: json
            output:
              route: string
              approval_required: boolean

    - id: draft
      run: agent
      use: drafter
      timeout: 10m
      prompt: |
        Draft a fix for the issues found in the review.
        Summary of issues:
        ${{ steps.review.output.summary }}
        Topic:
        ${{ input.topic }}
      output:
        draft_path: string
        resolved_count: integer

    - id: approval
      run: signal
      prompt: |
        Approve the drafted fix for ${{ input.topic }}?
        Route: ${{ steps.route.output.route }}
        Draft path: ${{ steps.draft.output.draft_path }}
      output:
        approved: boolean
      timeout: 30m
      on_timeout: default
      default:
        approved: false

    - id: followup_loop
      subworkflow: ./draft-review-loop.workflow.spec.yaml
      input:
        topic: "Follow-up for ${{ input.topic }}"
        output_root: ".acpus/output/example-review-guard/followup"

outputs:
  issue_count: ${{ steps.review.output.issue_count }}
  draft_path: "${{ has(steps.draft) ? steps.draft.output.draft_path : '' }}"
  resolved_count: "${{ has(steps.draft) ? steps.draft.output.resolved_count : 0 }}"
  route: "${{ has(steps.route) ? steps.route.output.route : '' }}"
  approved: "${{ has(steps.approval) ? steps.approval.output.approved : false }}"
  followup_draft_path: "${{ has(steps.followup_loop) ? steps.followup_loop.output.draft_path : '' }}"
